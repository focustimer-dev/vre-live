plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'work.samelling.vrelive.lab'
    compileSdk 36

    defaultConfig {
        applicationId 'work.samelling.vrelive.lab'
        minSdk 26
        targetSdk 36
        // Pull-request builds remain disposable; main-branch signed builds use a
        // monotonically increasing GitHub workflow run number for safe upgrades.
        // The package ID and signing certificate must stay unchanged.
        versionCode project.hasProperty('vreLabRunNumber')
            ? (100000 + project.property('vreLabRunNumber').toString().toInteger()) : 15
        versionName project.hasProperty('vreLabRunNumber')
            ? "0.1.14-lab.${project.property('vreLabRunNumber')}" : '0.1.14'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'org.mobilitydata:gtfs-realtime-bindings:0.0.8'
    // FCM only. No Analytics dependency or automatic token enrollment.
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}

def webAssets = rootProject.layout.projectDirectory.dir('web')
def sharedHtml = rootProject.layout.projectDirectory.file('../src/index.html')
def generatedAssets = layout.buildDirectory.dir('generated/vre-assets')
def npmInstall = tasks.register('installVreWebDependencies', Exec) {
    workingDir webAssets.asFile
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
    inputs.files(webAssets.file('package.json'), webAssets.file('package-lock.json'))
    outputs.dir(webAssets.dir('node_modules'))
}
def prepareAssets = tasks.register('prepareVreAssets', Exec) {
    dependsOn npmInstall
    workingDir webAssets.asFile
    commandLine 'node', 'build-assets.mjs', generatedAssets.get().dir('app').asFile.absolutePath
    inputs.files(sharedHtml, webAssets.file('build-assets.mjs'), webAssets.file('session.js'),
        webAssets.file('session.css'), webAssets.file('package-lock.json'))
    outputs.dir(generatedAssets)
}
android.sourceSets.main.assets.srcDir(generatedAssets)
tasks.named('preBuild').configure { dependsOn prepareAssets }
