<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VRE Live</title>
<meta name="theme-color" content="#09090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Crect x='16' y='8' width='32' height='38' rx='8' fill='%23fafafa'/%3E%3Crect x='21' y='15' width='22' height='11' rx='3' fill='%2309090b'/%3E%3Ccircle cx='24.5' cy='36' r='3.2' fill='%2309090b'/%3E%3Ccircle cx='39.5' cy='36' r='3.2' fill='%2309090b'/%3E%3Cpath d='M24 47L18 56M40 47L46 56' stroke='%23fafafa' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VRE">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  :root{
    --bg:#09090b; --card:#101013; --card-2:#17171b; --border:#26262b;
    --fg:#fafafa; --muted:#a1a1aa; --muted-2:#92929d;
    --red:#ef4444; --blue:#60a5fa; --green:#22c55e; --amber:#f59e0b;
    --radius:16px;
    /* type scale: micro / secondary / row / subhead / title / hero */
    --fs-1:11px; --fs-2:13px; --fs-3:14.5px; --fs-4:19px; --fs-5:24px; --fs-hero:52px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    font-size:15px; line-height:1.45; min-height:100%;}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #root{max-width:480px; margin:0 auto; padding:14px 14px 130px}
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px}
  .hdr h1{font-size:var(--fs-4); font-weight:700; margin:0; letter-spacing:-.02em; display:flex; gap:9px; align-items:center}
  .hdr .sub{font-size:var(--fs-1); color:var(--muted); text-align:right}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block;
    box-shadow:0 0 0 0 rgba(34,197,94,.55); animation:pulse 2.4s infinite}
  .dot.stale{background:var(--amber); animation:none}
  .dot.dead{background:var(--red); animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .card{background:linear-gradient(180deg,var(--card-2),var(--card)); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden}
  .card+.card{margin-top:12px}
  .card-h{padding:13px 16px 0; font-size:var(--fs-2); font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em}
  .map-wrap{padding:4px 6px 10px}
  svg{display:block; user-select:none}
  svg.sysmap{width:100%; height:auto}
  .st-label{font-size:10.5px; fill:var(--muted); font-weight:500}
  .st-label.major{fill:#d4d4d8; font-weight:600}
  .train{cursor:pointer; transition:transform .95s linear, opacity .4s; will-change:transform}
  .train text{text-rendering:geometricPrecision}
  .train .halo{opacity:0; transition:opacity .2s}
  .train.sel .halo{opacity:1; animation:ring 1.8s infinite}
  @keyframes ring{0%{r:16}50%{r:19}100%{r:16}}
  .tabs{display:flex; gap:4px; background:var(--card); border:1px solid var(--border);
    border-radius:13px; padding:4px; margin:0 0 12px}
  .tabs button{flex:1; appearance:none; border:0; border-radius:10px; background:transparent;
    color:var(--muted); font:inherit; font-weight:600; font-size:var(--fs-2); padding:8px 0; cursor:pointer;
    transition:background .15s,color .15s}
  .tabs button.on{background:var(--fg); color:#0a0a0a}
  .btn{appearance:none; border:0; border-radius:12px; font:inherit; font-weight:600; cursor:pointer;
    padding:12px 16px; width:100%; transition:transform .06s ease, opacity .15s;
    background:var(--fg); color:#0a0a0a; font-size:15px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45; cursor:default}
  .btn.outline{background:transparent; color:var(--fg); border:1px solid var(--border)}
  .btn.ghost{background:transparent; color:var(--muted); padding:8px 12px; width:auto; font-size:var(--fs-2)}
  .sheet{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px;
    background:rgba(16,16,19,.92); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); border-bottom:0; border-radius:20px 20px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom)); z-index:30;
    animation:up .32s cubic-bezier(.26,1.2,.44,1)}
  @keyframes up{from{transform:translate(-50%,40px); opacity:0}to{transform:translate(-50%,0); opacity:1}}
  .grab{width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 12px}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-1); font-weight:600;
    padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted); white-space:nowrap}
  .badge.line-F{color:#fca5a5; border-color:#7f1d1d; background:rgba(239,68,68,.08)}
  .badge.line-M{color:#93c5fd; border-color:#1e3a8a; background:rgba(96,165,250,.08)}
  .badge.ok{color:#86efac; border-color:#14532d; background:rgba(34,197,94,.08)}
  .badge.late{color:#fcd34d; border-color:#713f12; background:rgba(245,158,11,.09)}
  .badge.dim{opacity:.55}
  .livedot{width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block;
    animation:pulse 2.4s infinite}
  .tnum{font-size:var(--fs-5); font-weight:800; letter-spacing:-.02em}
  .meta{font-size:var(--fs-2); color:var(--muted)}
  .meta b{color:var(--fg); font-weight:600}
  .stops{max-height:42vh; overflow-y:auto; margin:10px -6px 0; padding:0 6px}
  .stop-btn,.stop-row{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:transparent; border:0; border-radius:11px; padding:11px 12px; font:inherit; color:var(--fg); font-weight:500}
  .stop-btn{cursor:pointer}
  .stop-btn:hover,.stop-btn:active{background:var(--card-2)}
  .stop-row{border-bottom:1px solid rgba(38,38,43,.6)}
  .stop-row:last-child{border-bottom:0}
  .t{color:var(--muted); font-variant-numeric:tabular-nums; font-size:var(--fs-2); display:inline-flex; align-items:center; gap:8px}
  .t .min{color:var(--fg); font-weight:700; min-width:36px; text-align:right}
  .eta-hero{padding:20px 18px 14px; text-align:center}
  .eta-big{font-size:var(--fs-hero); font-weight:800; letter-spacing:-.04em; line-height:1;
    font-variant-numeric:tabular-nums; margin:6px 0 2px}
  .eta-big small{font-size:var(--fs-4); font-weight:600; color:var(--muted); letter-spacing:0}
  .eta-big .tick{display:inline-block; animation:tickIn .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes tickIn{from{transform:translateY(.3em); opacity:0}}
  .eta-sub{color:var(--muted); font-size:var(--fs-2)}
  .eta-sub b{color:var(--fg)}
  .prog{display:flex; align-items:center; gap:0; margin:16px 4px 4px}
  .pseg{flex:1; height:3px; background:var(--border); position:relative}
  .pseg.done{background:var(--accent, var(--fg))}
  .pdot{width:9px; height:9px; border-radius:50%; background:var(--border); flex:none; z-index:1}
  .pdot.done{background:var(--accent, var(--fg))}
  .pdot.dest{width:12px; height:12px; border:2px solid var(--accent, var(--fg)); background:var(--bg)}
  .prog-lbls{display:flex; justify-content:space-between; font-size:var(--fs-1); color:var(--muted); margin:7px 6px 0}
  .alert-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid var(--border); margin-top:14px; padding:12px 2px 0; text-align:left}
  .ride-bar{display:flex; align-items:center; gap:8px; border-top:1px solid var(--border);
    margin-top:14px; padding:11px 2px 0}
  .icon-btn{appearance:none; background:transparent; border:1px solid var(--border); border-radius:10px;
    width:48px; height:48px; display:grid; place-items:center; color:var(--muted-2); cursor:pointer;
    transition:color .2s, border-color .2s, box-shadow .3s}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn.on{color:var(--accent, var(--green)); border-color:currentColor}
  .icon-btn.on.glow{animation:bellglow 2.4s ease-in-out infinite}
  @keyframes bellglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 11px -2px currentColor}}
  .alert-row .lbl{font-size:var(--fs-2); font-weight:600; display:flex; align-items:center; gap:8px}
  .alert-row .cap{font-size:var(--fs-1); color:var(--muted-2); margin-top:2px}
  .switch{position:relative; width:44px; height:26px; border-radius:999px; background:var(--border);
    border:0; cursor:pointer; transition:background .18s; flex:none; padding:0}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:var(--muted); transition:transform .18s, background .18s}
  .switch.on{background:var(--accent, var(--green))}
  .switch.on::after{transform:translateX(18px); background:#052e16}
  .sched{padding:6px 8px 10px}
  .sched-filters{display:flex; gap:6px; padding:10px 8px 6px}
  .chip{appearance:none; border:1px solid var(--border); background:transparent; color:var(--muted);
    font:inherit; font-size:var(--fs-1); font-weight:600; border-radius:999px; padding:5px 12px; cursor:pointer}
  .chip.on{background:var(--fg); color:#0a0a0a; border-color:var(--fg)}
  .srow{width:100%; appearance:none; background:transparent; border:0; border-bottom:1px solid rgba(38,38,43,.6);
    display:flex; align-items:center; gap:12px; padding:12px 10px; font:inherit; color:var(--fg);
    cursor:pointer; text-align:left; border-radius:0}
  .srow:hover{background:rgba(250,250,250,.025)}
  .srow:last-child{border-bottom:0}
  .srow.done{opacity:.42}
  .srow .numchip{flex:none; width:42px; height:27px; border-radius:8px; display:grid; place-items:center;
    font-size:var(--fs-2); font-weight:800; color:#0b0b0d}
  .srow .mid{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .srow .mid .l1{display:block; font-weight:600; font-size:var(--fs-3); line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .srow .mid .l2{display:block; font-size:var(--fs-1); line-height:1.25; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .srow .right{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
  .sexp{padding:2px 8px 10px 59px; animation:fade .25s}
  .sexp .stop-row{padding:6px 4px; font-size:13px}
  .banner{margin:10px 8px 2px; border:1px solid var(--border); background:rgba(245,158,11,.06);
    color:#fcd34d; border-radius:11px; padding:9px 13px; font-size:var(--fs-2)}
  .fld{display:flex; flex-direction:column; gap:5px; flex:1; font-size:var(--fs-1); color:var(--muted); font-weight:600}
  .fld select{appearance:none; background:var(--bg); border:1px solid var(--border); border-radius:10px;
    color:var(--fg); font:inherit; font-size:var(--fs-2); padding:9px 10px; outline:none; width:100%}
  .fld select:focus{border-color:#52525b}
  .srow:disabled{cursor:default}
  .train.ghost{cursor:pointer}
  .foot{display:flex; justify-content:space-between; align-items:center; padding:14px 4px 0; color:var(--muted-2); font-size:var(--fs-1)}
  .empty{padding:34px 20px; text-align:center; color:var(--muted); font-size:var(--fs-2)}
  .err{margin-top:12px; border:1px solid #7f1d1d; background:rgba(239,68,68,.07); color:#fca5a5;
    border-radius:12px; padding:11px 14px; font-size:var(--fs-2)}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .chev{transition:transform .2s; flex:none}
  .chev.open{transform:rotate(90deg)}
  /* schedule sections */
  .sect{display:flex; align-items:center; gap:8px; padding:12px 10px 4px;
    font-size:var(--fs-1); font-weight:700; color:var(--muted-2); text-transform:uppercase; letter-spacing:.08em}
  .nowline{display:flex; align-items:center; gap:10px; margin:10px 8px; color:var(--green);
    font-size:var(--fs-1); font-weight:700; font-variant-numeric:tabular-nums}
  .nowline::before,.nowline::after{content:""; flex:1; border-top:1px dashed rgba(34,197,94,.45)}
  .earlier-toggle{width:100%; appearance:none; background:transparent; border:0; border-top:1px solid rgba(38,38,43,.6);
    color:var(--muted-2); font:inherit; font-size:var(--fs-2); font-weight:600; padding:12px 10px 8px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px}
  .earlier-toggle:hover{color:var(--muted)}
  /* marey mini-chart */
  .marey-wrap{border-top:1px solid rgba(38,38,43,.6); margin:4px 8px 0; padding:0 2px 6px}
  .marey-toggle{width:100%; appearance:none; background:transparent; border:0; color:var(--muted-2);
    font:inherit; font-size:var(--fs-1); font-weight:700; text-transform:uppercase; letter-spacing:.08em;
    padding:10px 2px 8px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px}
  .marey-toggle:hover{color:var(--muted)}
  .marey-cap{font-size:var(--fs-1); color:var(--muted); font-weight:600; padding:2px 2px 4px}
  .marey-legend{display:flex; gap:13px; align-items:center; font-size:10px; color:var(--muted-2); padding:0 2px 7px}
  .marey-legend .sw{display:inline-block; width:15px; border-top:2px solid var(--muted); vertical-align:2px; margin-right:5px}
  .marey-legend .sw.dashed{border-top-style:dashed}
  .marey-legend .sw.nowsw{border-top:2px dashed var(--green)}
  /* you-are-here overlay */
  .ridepath{animation:dashmove 1.7s linear infinite}
  @keyframes dashmove{to{stroke-dashoffset:-20}}
  /* departure board */
  .brow{width:100%; appearance:none; background:transparent; border:0; text-align:left; font:inherit;
    color:var(--fg); display:flex; align-items:center; gap:12px; padding:13px 10px;
    border-bottom:1px solid rgba(38,38,43,.6); cursor:default}
  .brow.live{cursor:pointer}
  .brow.live:hover{background:rgba(250,250,250,.025)}
  .brow:last-child{border-bottom:0}
  .brow .bmid{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .brow .bhead{font-size:var(--fs-3); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:flex; align-items:center; gap:7px}
  .brow .bsub{font-size:var(--fs-1); color:var(--muted); display:flex; align-items:center; gap:7px}
  .brow .big{font-size:var(--fs-5); font-weight:800; font-variant-numeric:tabular-nums;
    letter-spacing:-.02em; text-align:right; min-width:70px; flex:none}
  .brow.stale .big{opacity:.55; font-style:italic}
  .brow.stale .bsub{font-style:italic}
  /* confidence shading */
  .stale-note{color:var(--amber); font-size:var(--fs-1); font-weight:600}
  .hero-stale{opacity:.55; font-style:italic}
  /* motion */
  .train .pop{animation:pop .35s cubic-bezier(.34,1.56,.64,1) both; transform-box:fill-box; transform-origin:center}
  @keyframes pop{from{transform:scale(.4); opacity:0}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
  /* installed-app mode */
  @media (display-mode: standalone){
    body{overscroll-behavior-y:none}
  }

  /* Keep compact visuals while giving controls room for a finger and clear focus. */
  .tabs button,.btn.ghost,.chip,.ride-actions .btn,.stop-btn.destination{min-height:48px}
  .sched-filters{flex-wrap:wrap}
  .eta-hero>.row{flex-wrap:wrap}
  .switch::before{content:"";position:absolute;inset:-9px 0}
  button:focus-visible,select:focus-visible,.train:focus-visible{
    outline:2px solid var(--fg);outline-offset:3px}
  .map-legend{display:flex;flex-wrap:wrap;gap:7px 16px;padding:0 16px 12px;
    color:var(--muted);font-size:var(--fs-2);line-height:1.4}
  .map-legend span{display:inline-flex;align-items:center;gap:7px}
  .map-key{display:inline-block;width:13px;height:13px;border-radius:50%;
    border:1.6px solid currentColor;flex:none}
  .map-key.solid{background:currentColor}
  .map-key.scheduled{border-style:dashed;background:var(--bg)}


  .sheet{max-height:calc(100dvh - 16px);display:flex;flex-direction:column}
  .sheet>.row{flex-shrink:0}.sheet .stops{min-height:0;max-height:38vh;overflow:auto}
  .stop-btn.destination{min-height:48px;border:1px solid transparent;gap:8px}
  .stop-btn.destination>span:first-child{min-width:0;overflow-wrap:anywhere}
  .stop-btn.destination.chosen{background:var(--card-2);border-color:var(--accent,var(--fg))}
  .choice-dot{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;flex:none}
  .chosen .choice-dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--fg)}
  .ride-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ride-actions button{min-height:44px;padding:10px;font-size:var(--fs-2)}
  .map-position-note{flex-basis:100%;font-size:var(--fs-1)}
  .brow{cursor:pointer}
  .eta-big{font-size:clamp(30px,11vw,52px)}

  .journey-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 10px 12px;border-bottom:1px solid var(--border)}
  .journey-title{display:flex;align-items:center;gap:10px;min-width:0}
  .journey-title strong{font-size:24px;line-height:1.15;letter-spacing:-.025em}
  .journey-title small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
  .journey-icon{width:38px;height:46px;flex-shrink:0;color:var(--accent)}
  .journey-views{display:flex;gap:3px;background:var(--bg);padding:3px;border-radius:12px}
  .journey-views button{font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--muted);border-radius:9px;min-height:44px;padding:0 10px;cursor:pointer}
  .journey-views button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  .journey-views button:focus-visible,.journey-next:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
  .journey-map{overflow:hidden;position:relative}
  .journey-map.focused{animation:journey-reveal .7s cubic-bezier(.16,1,.3,1)}
  @keyframes journey-reveal{from{clip-path:inset(4% 0 4% 0 round 16px)}to{clip-path:inset(0 round 0)}}
  .journey-next{appearance:none;font:inherit;color:var(--fg);width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 10px 15px;border:0;border-top:1px solid var(--border);background:transparent;cursor:pointer}
  .journey-next strong{display:block;font-size:17px;line-height:1.3}
  .journey-next small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
  .journey-next .journey-time{font-size:14px;font-weight:600;text-align:right;white-space:nowrap}
  .journey-foot{font-size:12px;color:var(--muted);padding:0 10px 12px}
  @media(max-width:350px){.journey-head{gap:6px;padding-left:4px;padding-right:4px}.journey-title{gap:7px}.journey-title strong{font-size:21px}.journey-views button{padding:0 7px}.journey-icon{width:29px}}
  @media(prefers-reduced-motion:reduce){.journey-map.focused{animation:none}.journey-map .train{transition:none}}
  .your-train-focus{cursor:pointer}.your-train-focus:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
</style>
</head>

<div id="root"></div>

<!-- ============= core: GTFS-RT parser + VRE data (no DOM/React deps) ============= -->
<script id="vre-core">
(function (g) {
  "use strict";

  /* ---------- minimal protobuf (GTFS-realtime subset) ---------- */
  function varint(b, st) {
    let x = 0n, s = 0n;
    for (;;) {
      const byte = b[st.p++];
      x |= BigInt(byte & 0x7f) << s;
      if (!(byte & 0x80)) break;
      s += 7n;
    }
    return x;
  }
  const TD = typeof TextDecoder !== "undefined" ? new TextDecoder() : null;

<script id="vre-app">
(function () {
  "use strict";
  if (typeof React === "undefined") {
    document.getElementById("root").innerHTML =
      '<div class="err">Could not load the UI library. This app needs internet access for its first load.</div>';
    return;
  }
  const html = htm.bind(React.createElement);
  const { useState, useEffect, useMemo, useRef, useCallback } = React;
  const { assemble, parseAlerts, STATIONS, LINE_F, LINE_M, isServiceDay, scheduleRows,
    schedStopsMs, schedPositionNow, nextDepartures } = VRECore;

  const serviceClock = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", weekday: "short", year: "numeric", month: "2-digit",
    day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
  });
  function automaticServiceWindow(now) {
    const parts = Object.fromEntries(serviceClock.formatToParts(now).map(p => [p.type, p.value]));
    if (["Sat", "Sun"].includes(parts.weekday) ||
        VRECore.SCHEDULE.noService.includes(parts.year + parts.month + parts.day)) return false;
    const minute = Number(parts.hour) * 60 + Number(parts.minute);
    return VRECore.SCHEDULE.trips.some(({ stops }) =>
      minute >= stops[0][1] - 20 && minute <= stops[stops.length - 1][1] + 20);
  }
  const REFRESH_MS = 180000;          // 3 minutes
  const MIN_FETCH_GAP = 65000;        // never hit the proxy/feeds faster than this
  const LINE_COLOR = { F: "#ef4444", M: "#60a5fa" };
  const LS_KEY = "vre-live-mytrip";
  const ROUTE_KEY = "vre-live-route";
  const DEV_KEY = "vre-devlog";
  const RIDE_KEY = "vre-ridelog";
  const ALL_CODES = [...LINE_F, ...LINE_M.slice(4)];

  const lsGet = (k, fb) => { try { return JSON.parse(localStorage.getItem(k)) ?? fb; } catch (_) { return fb; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

  /* delay-trend store: tripId -> [[ts, devMinutes], ...] for the last 6 hours */
  function recordDev(trains, ts) {
    const log = lsGet(DEV_KEY, {});
    const cutoff = Date.now() - 6 * 3600e3;
    for (const t of trains) {
      const arr = (log[t.tripId] || []).filter(s => s[0] > cutoff);
      if (!arr.length || ts - arr[arr.length - 1][0] > 45000)
        arr.push([ts, Math.round(t.schedDev / 6000) / 10]);
      log[t.tripId] = arr.slice(-60);
    }
    for (const k of Object.keys(log))
      if (!log[k].length || log[k][log[k].length - 1][0] < cutoff) delete log[k];
    lsSet(DEV_KEY, log);
    return log;
  }

  /* confidence: minutes since the train's last GPS fix, when older than 5 min */
  const staleMin = (train, now) => train && train.ts && now - train.ts > 5 * 60000
    ? Math.round((now - train.ts) / 60000) : null;

  /* smart alert lead: longer station gaps warn earlier (3-8 minutes) */
  function alertLead(train, destCode) {
    const idx = train ? train.stops.findIndex(s => s.code === destCode) : -1;
    const gap = idx > 0 ? train.stops[idx].time - train.stops[idx - 1].time : 8 * 60000;
    return Math.min(8 * 60000, Math.max(3 * 60000, gap * 0.4));
  }

  /* seed the delay trend from the proxy's snapshot history (one request, no upstream calls) */
  async function seedHistory() {
    try {
      const r = await fetch("feed/history", { cache: "no-store" });
      if (!r.ok) return null;
      const h = await r.json();
      const veh = h.VehiclePositionFeed || [], tu = h.TripUpdateFeed || [];
      if (!veh.length || !tu.length) return null;
      const b2u = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      let log = null;
      for (const v of veh) {
        let best = null;
        for (const u of tu) if (!best || Math.abs(u.t - v.t) < Math.abs(best.t - v.t)) best = u;
        if (!best || Math.abs(best.t - v.t) > 150000) continue;

      }
      return log;
    } catch (_) { return null; }
  }

  const fmtClock = ms => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtAge = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`; };
  const minsTo = (t, now) => Math.max(0, Math.round((t - now) / 60000));

  /** Returns null on success, or a short human-readable failure reason. */
  async function pushSubscribe(train, destCode) {

  function focusLayout(train) {
    const w = 104, h = 54, labels = mapLabelBoxes();
    const rightFirst = train.line === "M" && train.y > STATIONS["04"].y;
    const xs = rightFirst ? [train.x + 36, train.x - w - 36] : [train.x - w - 36, train.x + 36];
    let card;
    for (const dy of [0, -48, 48, -96, 96, -144, 144]) {
      for (const rawX of xs) {
        const b = { x: Math.max(14,Math.min(376-w,rawX)), y: Math.max(14,Math.min(686-h,train.y-h/2+dy)), w, h };

  // Reserve the active focus panel while separating other train badges.
  function layoutMarkers(markers, reserved = []) {
    const labels = [...mapLabelBoxes(), ...reserved];
    const occupied = [], positions = Object.create(null);
    for (const marker of [...markers].sort((a,b) => String(a.tripId).localeCompare(String(b.tripId)))) {
      const side = marker.line === "M" && marker.y > STATIONS["04"].y ? 1 : -1;
      const baseX = marker.x + side * (marker.active ? 60 : 36);
      const candidates = [];
      for (let ix = -5; ix <= 5; ix++) for (let iy = -10; iy <= 10; iy++) {
        const x = Math.max(32, Math.min(358, baseX + ix * 64));
        const y = Math.max(32, Math.min(668, marker.y + iy * 64));
        candidates.push({ x, y, score: (x-baseX)**2 + (y-marker.y)**2 });
      }
      candidates.sort((a,b) => a.score - b.score || a.x - b.x || a.y - b.y);
      const intersects = p => labels.some(b => p.x + 31 > b.x && p.x - 31 < b.x+b.w
        && p.y + 31 > b.y && p.y - 31 < b.y+b.h);

      const chosen = position || candidates.find(p => occupied.every(q => Math.hypot(p.x-q.x,p.y-q.y) >= 44)) || candidates[0];
      positions[marker.tripId] = chosen;
      occupied.push(chosen);
    }

  function Map({ trains, ghosts, selected, myTripId, myTrain: rideTrain, ride, now, onPick }) {

    const activeTrain = anchors.find(t => t.tripId === myTripId) || (rideTrain && rideTrain.x != null ? rideTrain : null);
    const nextStop = activeTrain && VRECore.remainingStops(activeTrain, t_now)[0];
    const fresh = !!activeTrain && !activeTrain.ghost && !activeTrain.signalLost && !!activeTrain.ts && t_now-activeTrain.ts <= 300000 && t_now-activeTrain.ts >= -60000;
    const positionLabel = !activeTrain ? "" : activeTrain.ghost ? "Timetable position" : !fresh ? "Last known position" : activeTrain.drifted ? "Projected position" : "Live feed";
    const nextState = nextStop && VRECore.rideStatus(activeTrain, nextStop.code, t_now);
    const nextTime = !nextStop ? "" : nextState.phase === "atStop" ? "Stopped here" : nextState.phase === "uncertain" ? "Time unconfirmed" : nextState.left < -90000 ? "Time unconfirmed" : nextState.left <= 70000 ? "Due" : `${Math.ceil(nextState.left/60000)} min`;
    const nextLabel = nextState && nextState.phase === "atStop" ? "At" : fresh ? "Next stop" : "Scheduled next";
    const focus = activeTrain ? focusLayout(activeTrain) : null;
    const positions = layoutMarkers(anchors.filter(t => t.tripId !== myTripId), focus ? [
      focus.card, { x: activeTrain.x-22, y: activeTrain.y-22, w:44, h:44 }

  /* ---------------- schedule card ---------------- */
  function ScheduleCard({ rows, now, onPickLive }) {
    const [dir, setDir] = useState(() => new Date(now).getHours() < 12 ? 1 : 0); // AM: to DC
    const [lineF, setLineF] = useState("all");
    const [open, setOpen] = useState(null);
    const [showEarlier, setShowEarlier] = useState(false);
    const service = isServiceDay(new Date(now));
    const shown = rows.filter(r => r.dir === dir && (lineF === "all" || r.line === lineF));

    // live-first: running trains pinned on top, then the now line, then upcoming;
    // finished trains collapse into a stub at the bottom
    const running = shown.filter(r => r.status === "live" || r.status === "quiet")
      .sort((a, b) => a.first - b.first);
    const upcoming = shown.filter(r => r.status === "soon" || r.status === "none");
    const earlier = shown.filter(r => r.status === "done");

    const statusChip = r => {
      if (r.status === "live") {
        const next = r.live.stops.find(s => s.time > now);
        const late = next && next.delay != null && next.delay >= 120;
        const seen = staleMin(r.live, now);
        if (seen) return html`<span className="badge dim" style=${{ fontStyle: "italic" }}>seen ${seen}m ago</span>`;
        return html`<${React.Fragment}>
          <span className="badge ok"><span className="livedot"></span>${next ? fmtWhen(next.time, now).replace("in ", "") : "live"}</span>
          ${late && html`<span className="badge late">+${Math.round(next.delay / 60)}m</span>`}
        <//>`;
      }
      if (r.status === "soon") return html`<span className="badge">${fmtWhen(r.first, now)}</span>`;
      if (r.status === "quiet") return html`<span className="badge dim">no signal</span>`;
      if (r.status === "none") return html`<span className="badge dim">${fmtClock(r.first)}</span>`;
      return html`<span className="badge dim">done</span>`;
    };

    const renderRow = r => {
      const origin = STATIONS[r.stops[0][0]].name;
      const isOpen = open === r.trip;
      const liveTimes = r.live ? Object.fromEntries(r.live.stops.map(s => [s.code, s.time])) : {};
      return html`
        <${React.Fragment} key=${r.trip}>
          <button className=${"srow" + (r.status === "done" ? " done" : "")}
            onClick=${() => onPickLive(r.trip)}
            aria-label=${`Choose train ${r.num}`}>
            <span className="numchip" style=${{ background: LINE_COLOR[r.line] }}>${r.num}</span>
            <span className="mid">
              <span className="l1">${origin} <span style=${{ color: "var(--muted-2)" }}>to</span> ${r.head}</span>
              <span className="l2">${r.status === "live" && r.live.nextStop
                ? `next ${STATIONS[r.live.nextStop].name}`
                : `${fmtClock(r.first)} → ${fmtClock(r.last)}`}</span>
            </span>
            <span className="right">${statusChip(r)}</span>
            <${Chevron} />
          </button>
          ${isOpen && r.status !== "live" && html`
            <div className="sexp">
              ${r.stops.map(([code, min]) => {
                const t = liveTimes[code] || (r.first - r.stops[0][1] * 60000 + min * 60000);
                return html`<div className="stop-row" key=${code}>
                  <span>${STATIONS[code].name}</span>
                  <span className="t">${fmtClock(t)}</span>
                </div>`;
              })}
            </div>`}
        <//>`;
    };

    return html`
      <div>
        <div className="sched-filters" role="tablist" aria-label="Schedule filters">
          <button className=${"chip" + (dir === 1 ? " on" : "")} onClick=${() => setDir(1)}>To DC</button>
          <button className=${"chip" + (dir === 0 ? " on" : "")} onClick=${() => setDir(0)}>Outbound</button>
          <span style=${{ flex: 1 }}></span>
          <button className=${"chip" + (lineF === "all" ? " on" : "")} onClick=${() => setLineF("all")}>All</button>
          <button className=${"chip" + (lineF === "F" ? " on" : "")}
            style=${lineF === "F" ? { background: LINE_COLOR.F, borderColor: LINE_COLOR.F, color: "#0b0b0d" } : { color: "#fca5a5" }}
            onClick=${() => setLineF("F")}>FBG</button>
          <button className=${"chip" + (lineF === "M" ? " on" : "")}
            style=${lineF === "M" ? { background: LINE_COLOR.M, borderColor: LINE_COLOR.M, color: "#0b0b0d" } : { color: "#93c5fd" }}
            onClick=${() => setLineF("M")}>MSS</button>
        </div>
        ${!service && html`<div className="banner">No VRE service today (weekday-only schedule shown).</div>`}
        <div className="sched">
          ${running.length > 0 && html`
            <${React.Fragment} key="running">
              <div className="sect">Running now</div>
              ${running.map(renderRow)}
            <//>`}
          ${service && (running.length > 0 || upcoming.length > 0) && html`
            <div className="nowline" role="separator" aria-label="Current time">${fmtClock(now)}</div>`}
          ${upcoming.map(renderRow)}
          ${!shown.length && html`<div className="empty">No trains match this filter.</div>`}
          ${earlier.length > 0 && html`
            <${React.Fragment} key="earlier">
              <button className="earlier-toggle" onClick=${() => setShowEarlier(!showEarlier)}
                aria-expanded=${showEarlier}>
                Earlier today · ${earlier.length} train${earlier.length === 1 ? "" : "s"}
                <${Chevron} open=${showEarlier} /></button>
              ${showEarlier && earlier.map(renderRow)}
            <//>`}
        </div>
      </div>`;
  }

  /* ---------------- Marey string diagram: the commute in time-space ---------------- */
  function Marey({ from, to, deps, liveByTrip, now }) {
    if (!deps.length) return null;
    // station axis: the codes between from & to in travel order, spaced by real km
    const lineCodes = (LINE_F.includes(from) && LINE_F.includes(to)) ? LINE_F : LINE_M;
    const iA = lineCodes.indexOf(from), iB = lineCodes.indexOf(to);
    if (iA < 0 || iB < 0 || iA === iB) return null;
    const seq = iA < iB ? lineCodes.slice(iA, iB + 1) : lineCodes.slice(iB, iA + 1).reverse();
    const kmAt = [0];
    for (let i = 1; i < seq.length; i++) {
      const A = STATIONS[seq[i - 1]], B = STATIONS[seq[i]];
      const dx = (B.lon - A.lon) * 86.8, dy = (B.lat - A.lat) * 111;
      kmAt.push(kmAt[i - 1] + Math.hypot(dx, dy));
    }
    const totalKm = kmAt[kmAt.length - 1] || 1;

    // left gutter keeps station labels out of the plot; bottom band holds the time axis
    const W = 340, H = 158, L = 64, R = 12, T = 16, B = 24;
    const t0 = now - 6 * 60000;
    const t1 = Math.max(...deps.map(d => d.arr)) + 4 * 60000;
    const X = t => L + (W - L - R) * (t - t0) / (t1 - t0);
    const Y = i => T + (H - T - B) * kmAt[i] / totalKm;
    const yOf = code => Y(seq.indexOf(code));
    const nowX = X(now);

    // time ticks every 20 min, skipping any that would crowd the now line
    const tickFmt = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      .replace(/\s?[AP]M/i, "");
    const ticks = [];
    for (let t = Math.ceil(t0 / 1200000) * 1200000; t <= t1; t += 1200000)
      if (Math.abs(X(t) - nowX) > 26) ticks.push(t);

    const stopsOf = dep => {
      const live = liveByTrip && liveByTrip[dep.trip];
      const all = live ? live.stops
        : schedStopsMs(VRECore.SCHEDULE.trips.find(t => t.trip === dep.trip), now);
      return all.filter(s => seq.includes(s.code));
    };
    const gutterName = name => name.length > 10 ? name.slice(0, 9) + "…" : name;

    return html`
      <div>
        <div className="marey-cap">${STATIONS[from].name} → ${STATIONS[to].name}</div>
        <div className="marey-legend">
          <span><i className="sw"></i>live</span>
          <span><i className="sw dashed"></i>scheduled</span>
          <span><i className="sw nowsw"></i>now</span>
          <span style=${{ marginLeft: "auto" }}>stations ↓ · time →</span>
        </div>
        <svg viewBox=${`0 0 ${W} ${H}`} style=${{ width: "100%", height: "auto" }}
          role="img" aria-label="Time-space diagram: stations vertically by distance, time horizontally, each train a line">
          ${seq.map((c, i) => {
            const ends = i === 0 || i === seq.length - 1;
            return html`
              <g key=${c}>
                <line x1=${L} y1=${Y(i)} x2=${W - R} y2=${Y(i)} stroke="var(--border)" strokeWidth="0.7"/>
                <circle cx=${L} cy=${Y(i)} r=${ends ? 2.6 : 1.5}
                  fill=${ends ? "#d4d4d8" : "var(--muted-2)"}/>
                <text x=${L - 7} y=${Y(i) + 3} fontSize=${ends ? 8.5 : 7} textAnchor="end"
                  fill=${ends ? "#d4d4d8" : "var(--muted-2)"} fontWeight=${ends ? 600 : 400}>
                  ${ends ? gutterName(STATIONS[c].name) : ""}</text>
              </g>`;
          })}
          <line x1=${L} y1=${H - B} x2=${W - R} y2=${H - B} stroke="var(--border)" strokeWidth="0.8"/>
          ${ticks.map(t => html`
            <g key=${t}>
              <line x1=${X(t)} y1=${H - B} x2=${X(t)} y2=${H - B + 3.5} stroke="var(--muted-2)" strokeWidth="0.8"/>
              <text x=${X(t)} y=${H - 6} fontSize="7.5" fill="var(--muted-2)" textAnchor="middle">${tickFmt(t)}</text>
            </g>`)}
          <line x1=${nowX} y1=${T} x2=${nowX} y2=${H - B} stroke="var(--green)" strokeWidth="1" strokeDasharray="3 2.5"/>
          <text x=${Math.max(L + 14, Math.min(nowX, W - 18))} y=${T - 5} fontSize="8"
            fill="var(--green)" textAnchor="middle" fontWeight="700">now</text>
          ${deps.map(dep => {
            const pts = stopsOf(dep).map(s => [X(s.time), yOf(s.code)]);
            if (pts.length < 2) return null;
            const c = LINE_COLOR[dep.line];
            // live position: interpolate where the train is at "now"
            let dot = null;
            const st = stopsOf(dep);
            for (let i = 0; i < st.length - 1; i++) {
              if (now >= st[i].time && now <= st[i + 1].time) {
                const f = (now - st[i].time) / ((st[i + 1].time - st[i].time) || 1);
                dot = [X(now), yOf(st[i].code) + f * (yOf(st[i + 1].code) - yOf(st[i].code))];
                break;
              }
            }
            return html`
              <g key=${dep.trip}>
                <polyline points=${pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}
                  fill="none" stroke=${c} strokeWidth=${dep.live ? 2 : 1.3}
                  strokeDasharray=${dep.live ? "" : "4 3"} strokeLinejoin="round" strokeLinecap="round"
                  opacity=${dep.live ? 0.95 : 0.6}/>
                <text x=${Math.max(L + 2, Math.min(pts[0][0] + 3, W - 24))} y=${Math.max(T + 8, pts[0][1] - 3.5)}
                  fontSize="8" fill=${c} fontWeight="700">${dep.num}</text>
                ${dep.live && dot && html`
                  <circle cx=${dot[0]} cy=${dot[1]} r="3.4" fill=${c} stroke="#0b0b0d" strokeWidth="1.2"/>`}
              </g>`;
          })}
        </svg>
      </div>`;
  }

  /* ---------------- ETA banner (riding mode) ---------------- */
  const ScreenIcon = ({ size = 15 }) => html`
    <svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
      <path d="M11 18.5h2"/>
    </svg>`;

  function EtaBanner({ train, dest, notify, pushActive, pushErr, wake, now, onNotify, onWake, onChange, onLeave, lockButton, lockError }) {
    const [showSet, setShowSet] = useState(false);
    const stop = train && train.stops.find(s => s.code === dest);
    if (!train) return html`
      <div className="card fade"><div className="eta-hero">
        <div className="eta-sub">Your train is no longer reporting.</div>
        ${lockButton && html`<div className="ride-bar">${lockButton}</div>`}
        ${lockError}
        <div style=${{ marginTop: 12 }}><button className="btn outline" onClick=${() => onLeave(true)}>I'm off the train</button></div>
      </div></div>`;
    if (!stop) return html`
      <div className="card fade"><div className="eta-hero">
        <div className="eta-sub">No prediction available for <b>${STATIONS[dest].name}</b> right now.</div>
        ${lockButton && html`<div className="ride-bar">${lockButton}</div>`}
        ${lockError}
        <div className="ride-actions"><button className="btn outline" onClick=${onChange}>Change stop</button><button className="btn" onClick=${() => onLeave(true)}>I'm off the train</button></div>
      </div></div>`;

    const mins = Math.round((stop.time - now) / 60000);
    const state = VRECore.rideStatus(train, dest, now);
    const phase = state.phase;
    const arrived = phase === "atStop";
    const hero = { atStop: "At stop", passed: "Passed", waiting: "Updating…", scheduledPast: "Time passed", due: "Due", scheduledDue: "Due" }[phase]
      || (phase === "uncertain" && mins <= 0 ? "Updating…" : null);
    const late = stop.delay != null && stop.delay >= 120;
    const seen = staleMin(train, now); // confidence: fresh GPS fix vs extrapolation
    const scheduledOnly = !!train.ghost;
    const statusClass = phase === "atStop" ? "ok" : phase === "passed" ? "late"
      : scheduledOnly || !state.fresh || phase === "waiting" || stop.delay == null ? "estimate" : late ? "late" : "ok";
    const statusText = phase === "atStop" ? "Stopped at your destination" : phase === "passed" ? "Destination passed"
      : scheduledOnly ? "Scheduled estimate" : !state.fresh ? "Live position unavailable"
      : phase === "waiting" ? "Arrival estimate passed" : stop.delay == null ? "Delay unconfirmed"
      : late ? `+${Math.round(stop.delay / 60)}m late` : "On time";
    const idxDest = train.stops.findIndex(s => s.code === dest);
    const idxNext = train.stops.findIndex(s => s.time > now);
    const doneCount = idxNext < 0 ? train.stops.length : idxNext;

    return html`
      <div className="card fade">
        <div className="eta-hero">
          <div className="row" style=${{ justifyContent: "center", gap: 8 }}>
            <span className=${"badge line-" + train.line}>${train.lineName}</span>
            <span className=${"badge " + statusClass}>${statusText}</span>
          </div>
          <div className=${"eta-big" + (seen ? " hero-stale" : "")}>${hero || html`<span><span key=${mins} className="tick">${mins}</span><small>m</small></span>`}</div>
          <div className="eta-sub">
            ${scheduledOnly ? "Scheduled at " : arrived ? "Stopped at " : phase === "passed" ? "Your stop was " : "Destination: "} <b>${stop.name}</b>
            ${arrived && !scheduledOnly ? "" : html`<span> · <b>${fmtClock(stop.time)}</b></span>`} · Train ${train.num}
          </div>
          ${train.schedDev > 60000 && html`
            <div className="eta-sub" style=${{ fontSize: "var(--fs-1)", color: "var(--muted-2)", marginTop: 3 }}>
              estimated from live train position (schedule +${Math.round(train.schedDev / 60000)}m)
            </div>`}
          ${seen && html`
            <div className="stale-note" style=${{ marginTop: 4 }}>
              last GPS fix ${seen}m ago — estimate may drift</div>`}
          ${["waiting", "scheduledPast", "uncertain"].includes(phase) && html`<div className="stale-note" style=${{ marginTop: 7 }}>Arrival is unconfirmed. Tracking stays open until you end it.</div>`}
          ${phase === "passed" && html`<div className="stale-note" style=${{ marginTop: 7 }}>The latest position is beyond your destination.</div>`}
          <div className="prog" aria-hidden="true">
            ${train.stops.slice(0, idxDest + 1).map((s, i) => html`
              <${React.Fragment} key=${s.code}>
                ${i > 0 && html`<div className=${"pseg" + (i <= doneCount ? " done" : "")}></div>`}
                <div className=${"pdot" + (i < doneCount ? " done" : "") + (i === idxDest ? " dest" : "")}></div>
              <//>`)}
          </div>
          <div className="prog-lbls">
            <span>${train.stops[0] ? train.stops[0].name : ""}</span>
            <span>${stop.name}</span>
          </div>
          ${(notify || androidRideAlert) && !pushActive && pushErr && html`
            <div className="stale-note" style=${{ marginTop: 8 }}>${androidRideAlert ? pushErr : "Background alerts: " + pushErr}</div>`}
          <div className="ride-bar">
            <button className=${"icon-btn" + (notify ? " on glow" : "")} aria-label=${androidRideAlert ? "Alert me for this ride" : "Arrival alerts"}
              aria-pressed=${notify}
              title=${androidRideAlert ? "Monitor this ride and alert near your stop" : notify ? (pushActive ? "Alerts on — works with app closed" : "Alerts on") : "Enable arrival alerts"}
              onClick=${onNotify}><${BellIcon} size=${16} /></button>
            ${canWake && html`
              <button className=${"icon-btn" + (wake ? " on" : "")} aria-label="Keep screen on"
                aria-pressed=${wake} title=${wake ? "Screen stays on" : "Keep screen on"}
                onClick=${onWake}><${ScreenIcon} size=${16} /></button>`}
            ${lockButton}
            <span style=${{ flex: 1 }}></span>
            <button className=${"icon-btn" + (showSet ? " on" : "")} aria-label="Trip options"
              aria-expanded=${showSet} onClick=${() => setShowSet(!showSet)}><${GearIcon} /></button>
          </div>
          ${lockError}
          <div className="ride-actions">
            <button className="btn outline" onClick=${onChange}>Change stop</button>
            <button className="btn" onClick=${() => onLeave(true)}>I'm off the train</button>
          </div>
          ${showSet && html`
            <div className="fade">
              <div className="row" style=${{ marginTop: 10, gap: 8 }}>
                <button className="btn ghost" style=${{ color: "var(--red)" }} onClick=${() => onLeave(false)}>Stop tracking</button>
              </div>
            </div>`}
        </div>
      </div>`;
  }

  /* ---------------- bottom sheet: train details / destination picker ---------------- */
  function Sheet({ train, now, devSamples, activeTrip, boardingStation, defaultDest, busy, onDest, onWait, onClose }) {
    const boardingIndex = train.stops.findIndex(s => s.code === boardingStation);
    const future = VRECore.remainingStops(train, now).filter(s =>
      train.stops.findIndex(stop => stop.code === s.code) > boardingIndex);
    const sameRide = activeTrip && (activeTrip.tripId === train.tripId || activeTrip.tripId === train.sourceTripId);
    const initial = sameRide ? activeTrip.dest : defaultDest;
    const [choice, setChoice] = useState(() => future.some(s => s.code === initial) ? initial : "");
    const [waiting, setWaiting] = useState(false);
    const destination = future.find(s => s.code === choice);
    const waitStop = destination && destination.code !== train.stops.at(-1)?.code;
    const switching = !!activeTrip && !sameRide;
    const closeRef = useRef(null);
    useEffect(() => {
      const previous = document.activeElement;
      const dismiss = () => { closeRef.current?.click(); return true; };
      window.vreDismissSheet = dismiss;
      closeRef.current?.focus();
      return () => {
        if (window.vreDismissSheet === dismiss) delete window.vreDismissSheet;
        if (previous?.isConnected) previous.focus();
      };
    }, []);
    return html`
      <div className="sheet" role="dialog" aria-label=${"Choose destination for train " + train.num}
        onKeyDown=${e => { if (e.key === "Escape") onClose(); }}>
        <div className="grab" aria-hidden="true"></div>
        <div className="row" style=${{ alignItems: "flex-start" }}>
          <div style=${{ minWidth: 0 }}>
            <div className="tnum">Train ${train.num}</div>
            <span className=${"badge line-" + train.line}>${train.lineName}</span>
            <div className="meta" style=${{ marginTop: 5 }}>
              ${train.headsign ? `Toward ${train.headsign}` : "Choose a destination below"}
            </div>
            ${train.ghost && html`<div className="stale-note">Timetable only · live position unavailable</div>`}
            ${!train.ghost && staleMin(train, now) && html`<div className="stale-note">Last GPS fix ${staleMin(train, now)}m ago</div>`}
          </div>
          <button ref=${closeRef} className="btn ghost" onClick=${onClose} aria-label="Close destination picker"><${XIcon} /></button>
        </div>
        <div className="meta" style=${{ marginTop: 14, color: "var(--fg)", fontWeight: 600 }}>${waiting ? "Where are you waiting?" : "Where will you get off?"}</div>
        ${!activeTrip && html`<button className="btn ghost" type="button" aria-pressed=${waiting} onClick=${() => { setWaiting(!waiting); setChoice(""); }}>${waiting ? "I’m already on the train" : "I’m waiting for this train"}</button>`}
        ${switching && html`<div className="stale-note" style=${{ marginTop: 6 }}>You are tracking train ${String(activeTrip.tripId).split("-")[0]}. Switching stops its alerts.</div>`}
        <div className="stops" role="group" aria-label=${waiting ? "Boarding stations" : "Destination stations"}>
          ${future.length ? future.filter(s => !waiting || s.code !== train.stops.at(-1)?.code).map(s => html`
            <button key=${s.code} className=${"stop-btn destination" + (choice === s.code ? " chosen" : "")}
              aria-pressed=${choice === s.code} onClick=${() => setChoice(s.code)}>
              <span>${s.name}</span>
              <span className="t">${fmtClock(s.time)} <span className="choice-dot" aria-hidden="true"></span></span>
            </button>`)
          : html`<div className="empty">No remaining stops in the latest data. Close this panel and try another train.</div>`}
        </div>
        <div style=${{ marginTop: 12 }}>
          <button className="btn" disabled=${!destination || busy || (waiting && !waitStop)} onClick=${() => destination && (waiting ? onWait(destination.code) : onDest(destination.code))}>
            ${waiting ? (destination ? "Track arrival at " + destination.name : "Choose your boarding station") : busy ? "Updating ride…" : destination ? `${switching ? "Switch train" : sameRide ? "Update destination" : "Start tracking"} · ${destination.name}` : "Choose a destination"}
          </button>
          <div className="meta" style=${{ marginTop: 7, fontSize: "var(--fs-1)" }}>${waiting ? "The Android widget shows the arrival at your station." : "You choose when to end the ride."}</div>
        </div>
      </div>`;
  }


  /* ---------------- root ---------------- */
  function App() {
    const [data, setData] = useState(null);          // {trains, feedTs}
    const [alerts, setAlerts] = useState([]);
    const [fetchedAt, setFetchedAt] = useState(0);
    const [error, setError] = useState(null);
    const [now, setNow] = useState(Date.now());
    const [tab, setTab] = useState(() =>
      window.location.pathname === "/__vre_android__/app/index.html" && new URLSearchParams(window.location.search).has("board") ? "board" : "map");
    const [selected, setSelected] = useState(null);  // tripId shown in sheet
    const [picking, setPicking] = useState(false);
    const [devlog, setDevlog] = useState(() => lsGet(DEV_KEY, {}));
    const widgetRoute = useMemo(() => {
      if (window.location.pathname !== "/__vre_android__/app/index.html") return null;
      const params = new URLSearchParams(window.location.search);
      const a = params.get("from"), b = params.get("to");
      return a !== b && ALL_CODES.includes(a) && ALL_CODES.includes(b) ? { a, b } : null;
    }, []);
    const [route, setRoute] = useState(() => widgetRoute || lsGet(ROUTE_KEY, null));
    const [editRoute, setEditRoute] = useState(false);
    const [flipDir, setFlipDir] = useState(widgetRoute ? false : null); // null = auto by time of day
    const [boardSta, setBoardSta] = useState(() => {
      const requested = window.location.pathname === "/__vre_android__/app/index.html"
        ? new URLSearchParams(window.location.search).get("board") : null;
      return ALL_CODES.includes(requested) ? requested
        : lsGet("vre-live-board", null) || (lsGet(ROUTE_KEY, null) || {}).a || "01";
    });
    const [summary, setSummary] = useState(null);
    const [myTrip, setMyTrip] = useState(() => {
      const saved = lsGet(LS_KEY, null);
      return saved && androidRideAlert ? { ...saved, notify: false, push: false, pushErr: null } : saved;
    });
    const alertSent = useRef(false);
    const lastFetch = useRef(0);

    const refresh = useCallback(async () => {
      const t = Date.now();
      if (t - lastFetch.current < MIN_FETCH_GAP) return;
      lastFetch.current = t;
      try {
        const [veh, tu] = await Promise.all([fetchFeed("VehiclePositionFeed"), fetchFeed("TripUpdateFeed")]);
        const assembled = assemble(veh, tu);
        setData(assembled);
        setFetchedAt(Date.now());
        setError(null);
        setDevlog(recordDev(assembled.trains, assembled.feedTs || Date.now()));
      } catch (e) {
        setError("Couldn't reach the VRE feeds. Retrying at the next cycle.");
      }
      try { // service alerts: separate so a missing feed never breaks the app
        const al = await fetchFeed("AlertFeed");
        setAlerts(parseAlerts(al, Date.now()));
      } catch (_) { /* no alert feed available */ }
    }, []);

    const [waitingFor, setWaitingFor] = useState(() => lsGet("vre-waiting-train", null));
    useEffect(() => { lsSet("vre-waiting-train", waitingFor); }, [waitingFor]);
    useEffect(() => {
      if (waitingFor && now - waitingFor.started >= 4 * 3600000) setWaitingFor(null);
    }, [waitingFor, now]);
    const activeRide = !!myTrip || !!(waitingFor && now - waitingFor.started < 4 * 3600000);
    const historySeeded = useRef(false);
    useEffect(() => {
      const poll = () => {
        if (document.visibilityState !== "visible") return;
        if (!activeRide && !automaticServiceWindow(Date.now())) return;
        refresh();
        if (!historySeeded.current) {
          historySeeded.current = true;
          seedHistory().then(log => { if (log) setDevlog(log); });
        }
      };
      poll();
      const id = setInterval(poll, REFRESH_MS);
      document.addEventListener("visibilitychange", poll);
      return () => {
        clearInterval(id);
        document.removeEventListener("visibilitychange", poll);
      };
    }, [refresh, activeRide]);
    useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);
    useEffect(() => {
      try { myTrip ? localStorage.setItem(LS_KEY, JSON.stringify(myTrip)) : localStorage.removeItem(LS_KEY); } catch (_) {}
    }, [myTrip]);
    useEffect(() => { lsSet("vre-live-board", boardSta); }, [boardSta]);

    const trains = data ? data.trains : [];
    const liveByTrip = useMemo(() => VRECore.liveTrainIndex(trains), [trains]);
    const schedRows = useMemo(() => scheduleRows(now, liveByTrip), [Math.floor(now / 30000), liveByTrip]);
    // ghost trains: in their service window but not reporting -> scheduled position
    const ghostTrains = useMemo(() => schedRows
      .filter(r => r.status === "quiet")
      .map(r => {
        const p = schedPositionNow(r, now);
        return p && {
          num: r.num, tripId: r.trip, routeId: r.line === "M" ? "4" : "2", dir: r.dir,
          line: r.line, lineName: r.line === "M" ? "Manassas Line" : "Fredericksburg Line",
          label: "", mph: null, status: null, nextStop: null, ts: null, schedDev: 0,
          ghost: true, stops: schedStopsMs(r, now), headsign: r.head, ...p,
        };
      }).filter(Boolean), [schedRows]);
    const selectedRow = schedRows.find(t => t.trip === selected);
    const selTrain = liveByTrip[selected] || ghostTrains.find(t => t.tripId === selected)
      || (selectedRow ? {
        num: selectedRow.num, tripId: selectedRow.trip, routeId: selectedRow.line === "M" ? "4" : "2",
        line: selectedRow.line, lineName: selectedRow.line === "M" ? "Manassas Line" : "Fredericksburg Line",
        dir: selectedRow.dir, headsign: selectedRow.head, ghost: true, ts: null,
        stops: schedStopsMs(selectedRow, now), ...(schedPositionNow(selectedRow, now) || {}),
      } : null);
    const observedTrain = myTrip ? liveByTrip[myTrip.tripId] || null : null;
    const myTrain = myTrip ? observedTrain || (myTrip.snapshot ? { ...myTrip.snapshot, signalLost: true }
      : ghostTrains.find(t => t.tripId === myTrip.tripId) || null) : null;
    const [rideBusy, setRideBusy] = useState(false);
    useEffect(() => {
      if (observedTrain) setMyTrip(m => m ? { ...m, snapshot: observedTrain } : m);
    }, [observedTrain]);
    const myStop = myTrain && myTrip ? myTrain.stops.find(s => s.code === myTrip.dest) : null;
    const rideDest = myTrip?.dest;
    const rideStarted = myTrip?.boardedAt;
    const rideTrip = myTrip?.tripId;
    useEffect(() => {
      if (!window.VreWidgetData) return;
      const live = Object.fromEntries(Object.entries(liveByTrip).map(([id, train]) =>
        [id, { ts: train.ts, stops: Object.fromEntries(train.stops.map(stop => [stop.code, stop.time])) }]));
      const ride = rideTrip && rideDest
        ? { trip: rideTrip, dest: rideDest, started: rideStarted, num: myTrain?.num, sourceTrip: myTrain?.sourceTripId || rideTrip,
            lead: alertLead(myTrain, rideDest),
            ts: observedTrain?.ts, eta: observedTrain && myStop?.time }
        : waitingFor ? (() => {
            const train = liveByTrip[waitingFor.trip];
            const stop = train?.stops.find(s => s.code === waitingFor.dest);
            return { ...waitingFor, waiting: true, ts: train?.ts, eta: stop?.time };
          })() : null;
      window.VreWidgetData.postMessage(JSON.stringify({ live, ride }));
    }, [liveByTrip, rideTrip, rideDest, rideStarted, observedTrain, waitingFor]);
    const lockBridge = window.VreLockCard;
    const [lockState, setLockState] = useState("off");
    const lockTripKey = myTrip ? [rideTrip, rideDest, rideStarted].join(":")
      : waitingFor ? [waitingFor.trip, waitingFor.dest, waitingFor.started, "waiting"].join(":") : "";
    useEffect(() => {
      setLockState("off");
      if (!lockBridge) return;
      lockBridge.onmessage = ({ data }) => setLockState(data);
      return () => { lockBridge.onmessage = null; };
    }, [lockBridge, lockTripKey]);
    const lockLabel = lockState === "on" ? "Hide from lock screen" : "Show on lock screen";
    const lockControl = compact => lockBridge && lockTripKey && html`
      <button className=${compact ? "icon-btn" + (lockState === "on" ? " on" : "") : "btn ghost"}
        aria-label=${lockLabel} title=${lockLabel} aria-pressed=${lockState === "on"}
        onClick=${() => lockBridge.postMessage(lockState === "on" ? "hide" : "show")}>
        ${compact ? html`<svg width="17" height="17" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2" />
        </svg>` : lockLabel}
      </button>`;
    const lockError = lockState === "blocked" && html`<div className="meta">Allow notifications in Android settings.</div>`;
    const boardRows = useMemo(() => tab === "board" ? VRECore.stationBoard(boardSta, now, liveByTrip, 8) : [],
      [tab, boardSta, Math.floor(now / 15000), liveByTrip]);

    // "you are here": path from my train to my destination, intermediates de-emphasized
    const ride = useMemo(() => {
      if (!myTrip || !myTrain || myTrain.x == null) return null;
      const idxDest = myTrain.stops.findIndex(s => s.code === myTrip.dest);
      if (idxDest < 0) return null;
      const via = myTrain.stops.slice(0, idxDest + 1)
        .filter(s => s.time > now - 60000).map(s => s.code);
      if (!via.length) return null;
      return {
        pathD: `M${myTrain.x.toFixed(1)},${myTrain.y.toFixed(1)} `
          + via.map(c => `L${STATIONS[c].x},${STATIONS[c].y}`).join(" "),
        color: LINE_COLOR[myTrain.line],
        dest: myTrip.dest,
        dim: new Set(via.filter(c => c !== myTrip.dest)),
      };
    }, [myTrip, myTrain, Math.floor(now / 30000)]);

    const finishRide = (completed = false) => {
      androidRideAlert?.postMessage("cancel");
      if (myTrip && myTrip.push) pushUnsubscribe();
      let rec = null;
      if (completed && myTrip && myTrip.boardedAt) {
        rec = {
          t: Date.now(), train: myTrain ? myTrain.num : (myTrip.tripId || "").split("-")[0],
          from: myTrip.from, dest: myTrip.dest,
          dur: Math.max(1, Math.round((Date.now() - myTrip.boardedAt) / 60000)),
          manuallyEnded: true,
        };
        lsSet(RIDE_KEY, [...lsGet(RIDE_KEY, []), rec].slice(-100));
      }
      setSummary(rec); setMyTrip(null); setSelected(null); setPicking(false);
    };
    const startRide = async code => {
      if (rideBusy || !selTrain || !VRECore.remainingStops(selTrain, now).some(s => s.code === code)) return;
      const train = selTrain;
      const same = myTrip && (myTrip.tripId === train.tripId || myTrip.tripId === train.sourceTripId);
      if (same && myTrip.dest === code) { setSelected(null); setPicking(false); return; }
      setRideBusy(true);
      try {
        androidRideAlert?.postMessage("cancel");
        alertSent.current = false;
        if (myTrip && myTrip.push) await pushUnsubscribe();
        const next = {
          ...(same ? myTrip : {}), tripId: train.tripId, dest: code,
          notify: same && !androidRideAlert ? !!myTrip.notify : false, push: false, pushErr: null,
          n5: false, n0: false,
          boardedAt: same ? myTrip.boardedAt : Date.now(),
          from: same ? myTrip.from : waitingFor?.trip === train.tripId ? waitingFor.dest : null, snapshot: train,
        };
        setWaitingFor(null); setMyTrip(next); setSelected(null); setPicking(false); setSummary(null);
        if (next.notify && !train.ghost && canNotify && Notification.permission === "granted") {
          const err = await pushSubscribe(train, code);
          setMyTrip(m => m && m.tripId === next.tripId && m.dest === code && m.boardedAt === next.boardedAt
            ? { ...m, push: !err, pushErr: err } : m);
        }
      } finally { setRideBusy(false); }
    };

    // between-poll countdown + threshold alerts (pure client side)
    useEffect(() => {
      if (myTrip && myStop) {
        const m = Math.max(0, Math.round((myStop.time - now) / 60000));
        const state = VRECore.rideStatus(myTrain, myTrip.dest, now);
        const title = state.phase === "atStop" ? "At your stop" : state.phase === "passed" ? "Stop passed"
          : state.phase === "waiting" || state.phase === "scheduledPast" ? "Awaiting update" : m <= 0 ? "Due" : m + " min";
        document.title = `${title} · ${myStop.name} — VRE Live`;
        if (myTrip.notify && !myTrip.push && state.fresh && ["enroute", "due", "atStop"].includes(state.phase)) {
          const left = myStop.time - now;
          const lead = alertLead(myTrain, myTrip.dest); // longer gaps warn earlier
          if (androidRideAlert) {
            // The Android service owns delivery, including while the phone is locked.
          } else if (!myTrip.n5 && state.phase !== "atStop" && left <= lead && left > 70000) {
            fireAlert(`${Math.max(1, Math.round(left / 60000))} minutes to ${myStop.name}`,
              `Train ${myTrain.num} · arriving ~${fmtClock(myStop.time)}`);
            setMyTrip({ ...myTrip, n5: true });
          } else if (!myTrip.n0 && (left <= 70000 || state.phase === "atStop")) {
            fireAlert(state.phase === "atStop" ? `Stopped at ${myStop.name}` : `Due at ${myStop.name}`, `Train ${myTrain.num} · check your stop`);
            setMyTrip({ ...myTrip, n0: true, n5: true });
          }
        }
      } else document.title = "VRE Live";
    }, [now]);

    useEffect(() => {
      if (!androidRideAlert || !myTrip) return;
      const sync = () => {
        androidRideAlert.onmessage = ({ data }) => {
          setMyTrip(current => current ? { ...current, notify: data === "armed", push: false,
            pushErr: data === "blocked" ? "Allow notifications in Android settings" : null } : current);
        };
        androidRideAlert.postMessage("status");
      };
      sync();
      document.addEventListener("visibilitychange", sync);
      return () => document.removeEventListener("visibilitychange", sync);
    }, [myTrip?.tripId, myTrip?.dest]);
    const servicePaused = !activeRide && !automaticServiceWindow(now);
    const age = fetchedAt ? now - fetchedAt : null;
    const health = !fetchedAt ? "dead" : error || age > REFRESH_MS + 60000 ? "stale" : "live";
    const nextIn = fetchedAt ? Math.max(0, REFRESH_MS - (now - lastFetch.current)) : 0;

    const pick = id => { setSelected(id === selected ? null : id); setPicking(false); };
    const toggleNotify = async () => {
      if (!myTrip) return;
      if (androidRideAlert) {
        if (myTrip.notify) {
          androidRideAlert.postMessage("cancel");
          setMyTrip({ ...myTrip, notify: false, pushErr: null });
        } else if (!myTrip.n5 && !alertSent.current) {
          const ride = myTrip;
          androidRideAlert.onmessage = ({ data }) => {
            setMyTrip(current => current && current.boardedAt === ride.boardedAt &&
                current.tripId === ride.tripId && current.dest === ride.dest
              ? { ...current, notify: data === "armed",
                  pushErr: data === "armed" ? null : "Allow notifications in Android settings" }
              : current);
          };
          androidRideAlert.postMessage("arm");
        }
        return;
      }
      if (myTrip.notify) {
        setMyTrip({ ...myTrip, notify: false, push: false });
        pushUnsubscribe();
        return;
      }
      ensureAudio(); // user gesture unlocks the chime
      try {
        if (canNotify && Notification.permission === "default") await Notification.requestPermission();
      } catch (_) {}
      setMyTrip({ ...myTrip, notify: true });
      // upgrade to background push when the worker supports it
      if (!canNotify || Notification.permission !== "granted") {
        setMyTrip(m => (m ? { ...m, notify: true, push: false, pushErr: "notifications blocked in browser settings" } : m));
      } else if (myTrain) {
        const err = await pushSubscribe(myTrain, myTrip.dest);
        setMyTrip(m => (m ? { ...m, notify: true, push: !err, pushErr: err } : m));
      }
    };
    const toggleWake = () => { if (myTrip) setMyTrip({ ...myTrip, wake: !myTrip.wake }); };

    // screen wake lock while riding (re-acquired when the tab becomes visible)
    const wakeRef = useRef(null);
    useEffect(() => {
      const want = !!(myTrip && myTrip.wake) && canWake;
      const acquire = async () => {
        if (wakeRef.current || document.visibilityState !== "visible") return;
        try {
          wakeRef.current = await navigator.wakeLock.request("screen");
          wakeRef.current.addEventListener("release", () => { wakeRef.current = null; });
        } catch (_) {}
      };
      const onVis = () => { if (document.visibilityState === "visible") acquire(); };
      if (want) { acquire(); document.addEventListener("visibilitychange", onVis); }
      return () => {
        document.removeEventListener("visibilitychange", onVis);
        if (wakeRef.current) { wakeRef.current.release().catch(() => {}); wakeRef.current = null; }
      };
    }, [!!(myTrip && myTrip.wake)]);

    // line-color theming while riding: tint the accent to your line
    const accent = myTrip && myTrain ? { "--accent": LINE_COLOR[myTrain.line] } : null;

    return html`
      <div style=${accent}>
        <div className="hdr">
          <h1><span className=${"dot " + (health === "live" ? "" : health)}></span>
            <${TrainIcon} size=${20} /> VRE Live</h1>
          <div className="sub">
            ${servicePaused ? "Live refresh paused" : fetchedAt ? html`<span>updated ${fmtAge(age)} ago<br/>next in ${Math.ceil(nextIn / 1000 / 60)}m</span>` : "connecting…"}
          </div>
        </div>

        ${alerts.length > 0 && html`
          <div className="card fade" style=${{ marginBottom: 12, borderColor: "#713f12" }}>
            <div className="card-h" style=${{ color: "var(--amber)", display: "flex", alignItems: "center", gap: 7 }}>
              <${AlertIcon} /> Service alerts</div>
            <div style=${{ padding: "6px 16px 14px" }}>
              ${alerts.map((a, i) => html`
                <div key=${i} className="meta" style=${{ marginTop: 7 }}>
                  <b>${a.effect}${a.routes.length ? " · " + a.routes.map(r => r === "4" ? "MSS" : "FBG").join(", ") : ""}</b>
                  ${a.header ? ` — ${a.header}` : ""}
                  ${a.desc && a.desc !== a.header && html`
                    <div style=${{ marginTop: 2, color: "var(--muted-2)" }}>${a.desc}</div>`}
                </div>`)}
            </div>
          </div>`}

        ${waitingFor && !myTrip && html`
          <div className="card"><div className="card-h">Waiting at ${STATIONS[waitingFor.dest]?.name} · Train ${waitingFor.num}</div>
            <div style=${{ padding: "0 10px 5px" }}>
              <button className="btn ghost" onClick=${() => { setSelected(waitingFor.trip); setPicking(true); }}>I'm on the train</button>
              <button className="btn ghost" onClick=${() => setWaitingFor(null)}>Stop waiting</button>
              ${lockControl(false)}
              ${lockError}
            </div>
          </div>`}
        ${summary && html`<${SummaryCard} rec=${summary} onDismiss=${() => setSummary(null)} />`}

        ${myTrip && html`
          <div style=${{ marginBottom: 12 }}>
            <${EtaBanner} train=${myTrain} dest=${myTrip.dest} notify=${!!myTrip.notify}
              pushActive=${!!myTrip.push} pushErr=${myTrip.pushErr || null} wake=${!!myTrip.wake} now=${now}
              onNotify=${toggleNotify} onWake=${toggleWake}
              onChange=${() => { if (myTrain) { setSelected(myTrain.tripId); setPicking(true); } }}
              onLeave=${finishRide} lockButton=${lockControl(true)} lockError=${lockError} />
          </div>`}

        ${!myTrip && html`
          <div style=${{ marginBottom: 12 }}>
            ${route && !editRoute
              ? (() => {
                  // round trip: mornings show home -> destination, afternoons the return
                  const autoReturn = new Date(now).getHours() >= 12;
                  const showReturn = flipDir === null ? autoReturn : flipDir;
                  return html`<${CommuteCard}
                    from=${showReturn ? route.b : route.a} to=${showReturn ? route.a : route.b}
                    auto=${flipDir === null || (route === widgetRoute && flipDir === false)} now=${now} liveByTrip=${liveByTrip}
                    onEdit=${() => setEditRoute(true)}
                    onFlip=${() => setFlipDir(!showReturn)}
                    onPickLive=${id => { setSelected(id); setPicking(false); }} />`;
                })()
              : html`<div className="card">
                  <div className="card-h">${route ? "Edit commute" : "Set up your commute"}</div>
                  <${RouteSetup} initial=${route}
                    onSave=${r => { lsSet(ROUTE_KEY, r); setRoute(r); setEditRoute(false); setFlipDir(null); }}
                    onCancel=${route ? (() => setEditRoute(false)) : null} />
                </div>`}
          </div>`}

        <div className="tabs" role="tablist">
          <button className=${tab === "map" ? "on" : ""} role="tab" aria-selected=${tab === "map"}
            onClick=${() => setTab("map")}>Map</button>
          <button className=${tab === "sched" ? "on" : ""} role="tab" aria-selected=${tab === "sched"}
            onClick=${() => setTab("sched")}>Schedule</button>
          <button className=${tab === "board" ? "on" : ""} role="tab" aria-selected=${tab === "board"}
            onClick=${() => setTab("board")}>Board</button>
        </div>

        ${tab === "map" ? html`
          <div className="card">
            <div className="card-h">System map · ${trains.length} train${trains.length === 1 ? "" : "s"} reporting</div>
            <div className="map-wrap">
              ${data
                ? (trains.length || ghostTrains.length)
                  ? html`<${Map} trains=${trains} ghosts=${ghostTrains} selected=${selected}
                      myTripId=${myTrain && myTrain.tripId} myTrain=${myTrain} ride=${ride} now=${now} onPick=${pick} />`
                  : html`<div className="empty">No trains reporting right now.<br/>VRE runs weekday commuter service.</div>`
                : html`<div className="empty">${servicePaused ? "Live refresh is paused. Check Schedule or refresh below." : error || "Loading live data…"}</div>`}
            </div>
            <div className="map-legend" aria-label="Map marker legend">
              <span><i className="map-key solid" aria-hidden="true"></i>Live feed</span>
              <span><i className="map-key scheduled" aria-hidden="true"></i>Timetable estimate</span>
              <span className="map-position-note">Frame: your train · dashed marker: estimated position.</span>
            </div>
          </div>`
        : tab === "sched" ? html`
          <div className="card">
            <div className="card-h">Today's schedule</div>
            <${ScheduleCard} rows=${schedRows} now=${now} onPickLive=${id => { pick(id); }} />
          </div>`
        : html`
          <div className="card">
            <div className="card-h">Departure board</div>
            <${BoardCard} station=${boardSta} rows=${boardRows} now=${now}
              onStation=${setBoardSta} onPickLive=${id => { pick(id); }} />
          </div>`}

        ${error && html`<div className="err">${error}</div>`}

        <div className="foot">
          <span>Feed ${data && data.feedTs ? "stamped " + fmtClock(data.feedTs) : ""}</span>
          <button className="btn ghost" onClick=${() => refresh()}
            disabled=${now - lastFetch.current < MIN_FETCH_GAP}>
            ${now - lastFetch.current < MIN_FETCH_GAP
              ? `refresh in ${Math.ceil((MIN_FETCH_GAP - (now - lastFetch.current)) / 1000)}s`
              : "refresh now"}</button>
        </div>

        ${selTrain && html`
          <${Sheet} key=${selTrain.tripId} train=${selTrain} picking=${picking} now=${now}
            activeTrip=${myTrip} busy=${rideBusy}
            boardingStation=${waitingFor?.trip === selTrain.tripId ? waitingFor.dest : null}
            defaultDest=${route ? ((flipDir === null ? new Date(now).getHours() >= 12 : flipDir) ? route.a : route.b) : null}
            devSamples=${devlog[selTrain.tripId]}
            onBoard=${() => setPicking(true)}
            onWait=${code => {
              const scheduled = VRECore.SCHEDULE.trips.find(t => t.trip === selTrain.tripId);
              setWaitingFor({ trip: selTrain.tripId, num: selTrain.num, dest: code, started: Date.now(),
                scheduled: scheduled ? schedStopsMs(scheduled, now).find(s => s.code === code)?.time : null });
              setSelected(null); setPicking(false);
            }}
            onDest=${startRide}
            onClose=${() => { setSelected(null); setPicking(false); }} />`}
      </div>`;
  }

  // exposed for the node render test (test_render.mjs)
  window.__VRE_APP = { mapLabelBoxes, focusLayout, layoutMarkers, App, Map, ScheduleCard, EtaBanner, Sheet, CommuteCard, RouteSetup, SummaryCard, Sparkline, Marey, BoardCard };

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
