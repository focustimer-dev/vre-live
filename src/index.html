<script id="vre-theme">
(function (root) {
  "use strict";
  const KEY = "vre-live-theme-v1";
  const THEMES = ["electric-stars", "nord-light"];
  const valid = name => THEMES.includes(name) ? name : "electric-stars";
  let stored = null;
  try { stored = window.localStorage.getItem(KEY); } catch (_) {}
  const initial = valid(stored);
  root.setAttribute("data-theme", initial);
  function choose(value) {
    const theme = valid(value);
    root.setAttribute("data-theme", theme);
    try { window.localStorage.setItem(KEY, theme); } catch (_) {}
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "nord-light" ? "#ECEFF4" : "#011629");
    return theme;
  }
  // Apply the restored theme to both the page and browser/system chrome before first paint.
  choose(initial);
  window.VRETheme = Object.freeze({ KEY, THEMES, initial, choose });
})(document.documentElement);
</script>
<style>
  /* Stable semantic tokens; Electric Stars is dark-first for new installs.
     Surfaces ~60% abyss / ~30% petrol+plum, with cobalt/orchid/lilac accents.
     Keep small text AA readable: cobalt is NOT a body-text color. */
  :root, :root[data-theme="electric-stars"] {
    color-scheme: dark;
    --bg:#011629; --bg-glow:rgba(58,116,219,.10);
    --card:#0C426D; --card-2:#372B68; --card-elevated:#273659;
    --card-glow:rgba(190,116,205,.13); --card-glint:rgba(246,184,251,.52);
    --card-shadow:rgba(0,12,26,.18); --nav:#372B68;
    --border:rgba(246,184,251,.32); --border-soft:rgba(246,184,251,.19);
    --fg:#F6B8FB; --muted:#E2D8F4; --muted-2:#D5C9E9; --meta-ink:#F6B8FB; --meta-on-bg:#BE74CD;
    --red:#FFADB8; --blue:#A3C8FF; --green:#BAF6DA; --amber:#FFE09A;
    --accent:#3A74DB; --action-bg:#F6B8FB; --action-fg:#011629;
    --action-border:#3A74DB; --selected-bg:#F6B8FB; --selected-fg:#011629;
    --sheet-bg:rgba(12,66,109,.96); --surface-hover:rgba(246,184,251,.09);
    --banner-bg:rgba(255,224,154,.10); --danger-bg:rgba(255,173,184,.12);
    --map-label-major:#F6B8FB; --map-ink:#011629; --map-highlight:#F6B8FB;
    --map-stroke:#F6B8FB; --line-F:#FF9BA7; --line-M:#A6CBFF;
    --line-ink:#011629; --line-separator:rgba(246,184,251,.22);
    --accent-outline:#BE74CD; --ring:rgba(246,184,251,.8);
    --tab-surface:#372B68; --focus:#F6B8FB; --pulse:rgba(186,246,218,.45);
    --radius:16px;
    /* type scale: micro / secondary / row / subhead / title / hero */
    --fs-1:11px; --fs-2:13px; --fs-3:14.5px; --fs-4:19px; --fs-5:24px; --fs-hero:52px;
  }
  :root[data-theme="nord-light"] {
    color-scheme: light;
    --bg:#ECEFF4; --bg-glow:rgba(94,129,172,.09);
    --card:#FFFFFF; --card-2:#E5E9F0; --card-elevated:#FAFCFF;
    --card-glow:rgba(94,129,172,.06); --card-glint:rgba(76,86,106,.28);
    --card-shadow:rgba(46,52,64,.08); --nav:#D8DEE9;
    --border:#BAC5D1; --border-soft:rgba(76,86,106,.18);
    --fg:#2E3440; --muted:#434C5E; --muted-2:#4C566A; --meta-ink:#434C5E; --meta-on-bg:#4C566A;
    --red:#9D3044; --blue:#365F90; --green:#236A4C; --amber:#8A551A;
    --accent:#365F90; --action-bg:#2E3440; --action-fg:#ECEFF4;
    --action-border:#365F90; --selected-bg:#2E3440; --selected-fg:#ECEFF4;
    --sheet-bg:rgba(236,239,244,.97); --surface-hover:rgba(76,86,106,.07);
    --banner-bg:rgba(138,85,26,.08); --danger-bg:rgba(157,48,68,.08);
    --map-label-major:#2E3440; --map-ink:#FFFFFF; --map-highlight:#2E3440;
    --map-stroke:#2E3440; --line-F:#B74652; --line-M:#4574A4;
    --line-ink:#FFFFFF; --line-separator:rgba(76,86,106,.18);
    --accent-outline:#5E81AC; --ring:rgba(54,95,144,.72);
    --tab-surface:#D8DEE9; --focus:#365F90; --pulse:rgba(35,106,76,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    font-size:15px; line-height:1.45; min-height:100%;}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:radial-gradient(ellipse at 80% 0%,var(--bg-glow),transparent 47%),var(--bg);
    background-attachment:fixed}
  #root{max-width:480px; margin:0 auto; padding:14px 14px 130px}
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 14px}
  .hdr h1{font-size:var(--fs-4); font-weight:700; margin:0; letter-spacing:-.02em; display:flex; gap:9px; align-items:center}
  .hdr .sub{font-size:var(--fs-1); color:var(--meta-on-bg); text-align:right}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block;
    box-shadow:0 0 0 0 var(--pulse); animation:pulse 2.4s infinite}
  .dot.stale{background:var(--amber); animation:none}
  .dot.dead{background:var(--red); animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--pulse)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .card{background:radial-gradient(ellipse at 4% 0%,var(--card-glow),transparent 65%),
    linear-gradient(165deg,var(--card-elevated),var(--card)); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden}
  .card+.card{margin-top:12px}
  .card-h{padding:13px 16px 0; font-size:var(--fs-2); font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:.06em}
  .map-wrap{padding:4px 6px 10px}
  svg{display:block; user-select:none}
  svg.sysmap{width:100%; height:auto}
  .st-label{font-size:10.5px; fill:var(--muted); font-weight:500}
  .st-label.major{fill:var(--map-label-major); font-weight:600}
  .train{cursor:pointer; transition:transform .95s linear, opacity .4s; will-change:transform}
  .train text{text-rendering:geometricPrecision}
  .train .halo{opacity:0; transition:opacity .2s}
  .train.sel .halo{opacity:1; animation:ring 1.8s infinite}
  @keyframes ring{0%{r:16}50%{r:19}100%{r:16}}
  .tabs{display:flex; gap:4px; background:var(--tab-surface); border:1px solid var(--border);
    border-radius:13px; padding:4px; margin:0 0 12px}
  .tabs button{flex:1; appearance:none; border:0; border-radius:10px; background:transparent;
    color:var(--muted); font:inherit; font-weight:600; font-size:var(--fs-2); padding:8px 0; cursor:pointer;
    transition:background .15s,color .15s}
  .tabs button.on{background:var(--selected-bg); color:var(--selected-fg)}
  .tabs button.pref-nav{flex:0 0 48px;display:inline-flex;align-items:center;justify-content:center;
    padding:8px;min-width:44px}
  .tabs button{min-width:0}
  .preferences{display:grid;gap:12px}
  .pref-list{padding:6px 8px 8px}
  .pref-choice{width:100%;min-height:72px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px 10px;text-align:left;border:0;border-bottom:1px solid var(--border);
    color:var(--fg);background:transparent;font:inherit;cursor:pointer;border-radius:10px}
  .pref-choice:last-child{border-bottom:0}
  .pref-choice strong{display:block;font-size:var(--fs-3);font-weight:650}
  .pref-choice small{display:block;color:var(--muted);font-size:var(--fs-2);line-height:1.4;margin-top:2px}
  .pref-choice:active{background:var(--card-2)}
  .pref-arrow{font-size:26px;line-height:1;color:var(--muted)}
  .pref-back{appearance:none;border:0;background:transparent;color:var(--muted);
    cursor:pointer;font:inherit;font-size:var(--fs-2);font-weight:600;
    padding:10px 2px;min-height:44px;text-align:left;width:max-content}
  .pref-back span{font-size:24px;vertical-align:-2px;margin-right:6px}
  .pref-description{color:var(--muted);font-size:var(--fs-2);margin:9px 16px 12px}
  .pref-choice:focus-visible,.pref-back:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .global-alert-body{padding:6px 14px 16px}
  .global-alert-row{display:flex;align-items:center;justify-content:space-between;
    gap:14px;padding:14px 2px;min-height:65px;border-bottom:1px solid var(--border)}
  .global-alert-copy{min-width:0;flex:1}
  .global-alert-copy strong{display:block;font-size:var(--fs-3)}
  .global-alert-copy small{display:block;color:var(--muted);font-size:var(--fs-2);
    margin-top:4px;line-height:1.4}
  .global-alert-row input[type="checkbox"]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
  .global-alert-row input:disabled{opacity:.4}
  .global-alert-lead{padding:12px 2px}
  .global-alert-section{font-size:var(--fs-2);font-weight:700;color:var(--muted);
    margin:16px 2px 0}
  .global-alert-migrate{display:grid;gap:9px;padding:14px 0}
  .global-alert-migrate .btn{min-height:44px}

  .waiting-card{margin-bottom:12px}
  .waiting-body{padding:14px 16px 16px}
  .waiting-countdown{font-size:clamp(32px,11vw,46px);font-weight:800;letter-spacing:-.04em;
    line-height:1.15;font-variant-numeric:tabular-nums;margin:2px 0 6px}
  .waiting-source{margin-top:5px}
  .waiting-unconfirmed{color:var(--amber)}
  .waiting-actions{display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0 5px}
  .waiting-actions .btn{min-height:48px}
  .waiting-card .btn.ghost{padding-left:0}
  .daily-travel-control{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
    margin-top:7px;font-size:var(--fs-2);color:var(--muted)}
  .daily-travel-control input{width:64px;max-width:64px;font:inherit;font-size:var(--fs-2);
    color:var(--fg);background:var(--card);border:1px solid var(--border);
    border-radius:8px;padding:5px 7px;text-align:center}
  .daily-travel-control .btn{width:auto;padding:5px 8px}
  .leave-by-card{margin:9px 0 3px;padding:12px;border-radius:12px;
    border:1px solid var(--border);background:var(--card-2)}
  .leave-by-label{color:var(--muted);font-size:var(--fs-2);font-weight:650}
  .leave-by-time{font-size:clamp(25px,8vw,36px);font-weight:800;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;line-height:1.15;margin:4px 0}
  .leave-by-remaining{font-weight:700;font-size:var(--fs-2);margin:5px 0}
  .leave-by-confidence{margin-top:5px}
  .today-train-leave{display:block;color:var(--muted);font-size:var(--fs-1);font-weight:400;
    margin-top:3px}
  .today-compact{margin:12px 0}
  .today-compact-body{padding:10px 14px 14px}
  .today-compact-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .today-compact-top>div{min-width:0}
  .today-compact-time{font-size:clamp(18px,5vw,25px);line-height:1.2;
    font-weight:750;letter-spacing:-.02em;margin:5px 0}
  .today-plan-edit{flex:none;white-space:nowrap}
  .today-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .commute-plan-trigger{white-space:nowrap}
  .today-commute{margin-bottom:12px}
  .today-body{padding:10px 14px 12px}
  .today-row{display:flex;align-items:center;gap:12px;justify-content:space-between;
    border-top:1px solid var(--border);min-height:72px;padding:10px 0}
  .today-row:first-of-type{border-top:0}
  .today-row strong,.today-head strong{display:block;font-size:var(--fs-3)}
  .today-plan{width:auto;min-width:108px;min-height:44px;padding:8px 12px;font-size:var(--fs-2)}
  .today-skip{margin-top:6px}
  .today-head{margin:4px 0 12px}
  .today-train{width:100%;min-height:54px;border:0;border-top:1px solid var(--border);
    background:transparent;color:var(--fg);font:inherit;font-weight:600;display:flex;
    align-items:center;justify-content:space-between;cursor:pointer;text-align:left}
  .today-train:focus-visible,.today-plan:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .today-footnote{padding-top:10px}
  .today-back{padding-left:0}

  /* One glanceable commute instruction. Expanded details are intentionally optional. */
  .commute-focus{border-color:var(--card-glint);box-shadow:0 7px 24px var(--card-shadow)}
  .commute-focus-content{padding:20px 20px 16px}
  .commute-focus-label{font-size:var(--fs-2);font-weight:750;letter-spacing:.08em;
    text-transform:uppercase;color:var(--meta-ink)}
  .commute-focus-headline{margin:8px 0 4px;font-size:clamp(30px,9vw,42px);
    font-weight:800;letter-spacing:-.04em;line-height:1.12;color:var(--fg)}
  .commute-focus-headline.empty{font-size:clamp(19px,5vw,23px)}
  /* An exhausted timetable must never claim a full-size hero or bury the map. */
  .commute-focus.no-departures .commute-focus-content{padding:14px 16px 10px}
  .commute-focus.no-departures .commute-focus-headline.empty{
    padding:0;margin:8px 0 2px;line-height:1.25;text-align:left;
    color:var(--fg);letter-spacing:-.018em;font-weight:750}
  .commute-focus.no-departures .commute-focus-route{margin-top:3px}
  .commute-focus.no-departures .commute-focus-actions{margin-top:6px}
  .commute-focus.no-departures .commute-options{padding:6px 8px}
  .commute-focus-train{font-size:clamp(17px,4.8vw,20px);font-weight:700;color:var(--fg)}
  .commute-focus-route{margin-top:6px;font-size:var(--fs-3);color:var(--muted)}
  .commute-focus-warning{margin-top:10px;font-size:var(--fs-2);color:var(--amber)}
  .commute-focus-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}
  .commute-focus-actions .btn{width:auto;min-height:46px;padding:10px 15px}
  .commute-focus-actions .commute-options{font-size:var(--fs-2);color:var(--fg)}
  .commute-extra{border-top:1px solid var(--line-separator);margin-top:16px;padding-top:10px}
  .commute-extra-actions{display:flex;flex-wrap:wrap;gap:8px}
  .commute-extra-actions .btn{min-height:44px}
  .commute-extra-label{margin:12px 8px 2px;font-size:var(--fs-2);
    font-weight:700;color:var(--muted)}

  .btn{appearance:none; border:0; border-radius:12px; font:inherit; font-weight:600; cursor:pointer;
    padding:12px 16px; width:100%; transition:transform .06s ease, opacity .15s;
    background:var(--action-bg); color:var(--action-fg); border:1px solid var(--action-border); font-size:15px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45; cursor:default}
  .btn.outline{background:transparent; color:var(--fg); border:1px solid var(--border)}
  .btn.ghost{background:transparent; color:var(--muted); padding:8px 12px; width:auto; font-size:var(--fs-2)}
  .sheet{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px;
    background:var(--sheet-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); border-bottom:0; border-radius:20px 20px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom)); z-index:30;
    animation:up .32s cubic-bezier(.26,1.2,.44,1)}
  @keyframes up{from{transform:translate(-50%,40px); opacity:0}to{transform:translate(-50%,0); opacity:1}}
  .grab{width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 12px}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-1); font-weight:600;
    padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--muted); white-space:nowrap}
  .badge.line-F{color:var(--line-F); border-color:var(--line-F); background:var(--surface-hover)}
  .badge.line-M{color:var(--line-M); border-color:var(--line-M); background:var(--surface-hover)}
  .badge.ok{color:var(--green); border-color:var(--green); background:var(--surface-hover)}
  .badge.late{color:var(--amber); border-color:var(--amber); background:var(--banner-bg)}
  .badge.dim{opacity:.55}
  .livedot{width:6px; height:6px; border-radius:50%; background:var(--green); display:inline-block;
    animation:pulse 2.4s infinite}
  .tnum{font-size:var(--fs-5); font-weight:800; letter-spacing:-.02em}
  .meta{font-size:var(--fs-2); color:var(--muted)}
  .meta b{color:var(--fg); font-weight:600}
  .stops{max-height:42vh; overflow-y:auto; margin:10px -6px 0; padding:0 6px}
  .stop-btn,.stop-row{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left;
    background:transparent; border:0; border-radius:11px; padding:11px 12px; font:inherit; color:var(--fg); font-weight:500}
  .stop-btn{cursor:pointer}
  .stop-btn:hover,.stop-btn:active{background:var(--card-2)}
  .stop-row{border-bottom:1px solid var(--line-separator)}
  .stop-row:last-child{border-bottom:0}
  .t{color:var(--muted); font-variant-numeric:tabular-nums; font-size:var(--fs-2); display:inline-flex; align-items:center; gap:8px}
  .t .min{color:var(--fg); font-weight:700; min-width:36px; text-align:right}
  .eta-hero{padding:20px 18px 14px; text-align:center}
  .eta-big{font-size:var(--fs-hero); font-weight:800; letter-spacing:-.04em; line-height:1;
    font-variant-numeric:tabular-nums; margin:6px 0 2px}
  .eta-big small{font-size:var(--fs-4); font-weight:600; color:var(--muted); letter-spacing:0}
  .eta-big .tick{display:inline-block; animation:tickIn .3s cubic-bezier(.2,.9,.3,1)}
  @keyframes tickIn{from{transform:translateY(.3em); opacity:0}}
  .eta-sub{color:var(--muted); font-size:var(--fs-2)}
  .eta-sub b{color:var(--fg)}
  .prog{display:flex; align-items:center; gap:0; margin:16px 4px 4px}
  .pseg{flex:1; height:3px; background:var(--border); position:relative}
  .pseg.done{background:var(--accent, var(--fg))}
  .pdot{width:9px; height:9px; border-radius:50%; background:var(--border); flex:none; z-index:1}
  .pdot.done{background:var(--accent, var(--fg))}
  .pdot.dest{width:12px; height:12px; border:2px solid var(--accent, var(--fg)); background:var(--bg)}
  .prog-lbls{display:flex; justify-content:space-between; font-size:var(--fs-1); color:var(--muted); margin:7px 6px 0}
  .alert-row{display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid var(--border); margin-top:14px; padding:12px 2px 0; text-align:left}
  .ride-bar{display:flex; align-items:center; gap:8px; border-top:1px solid var(--border);
    margin-top:14px; padding:11px 2px 0}
  .icon-btn{appearance:none; background:transparent; border:1px solid var(--border); border-radius:10px;
    width:48px; height:48px; display:grid; place-items:center; color:var(--muted-2); cursor:pointer;
    transition:color .2s, border-color .2s, box-shadow .3s}
  .icon-btn:active{transform:scale(.96)}
  .icon-btn.on{color:var(--accent, var(--green)); border-color:currentColor}
  .icon-btn.on.glow{animation:bellglow 2.4s ease-in-out infinite}
  @keyframes bellglow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 11px -2px currentColor}}
  .alert-row .lbl{font-size:var(--fs-2); font-weight:600; display:flex; align-items:center; gap:8px}
  .alert-row .cap{font-size:var(--fs-1); color:var(--muted-2); margin-top:2px}
  .switch{position:relative; width:44px; height:26px; border-radius:999px; background:var(--border);

  const _lineCache = {};

    const pts = codes.map(c => geo(STATIONS[c].lat, STATIONS[c].lon));
    const cum = [0];
    for (let i = 1; i < pts.length; i++)
      cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));

  // nearest point on the line: schematic x/y + km travelled from Union Station
  function locate(routeId, lat, lon) {
    const { codes, pts, cum } = lineData(routeId);
    const [px, py] = geo(lat, lon);
    let best = { d: Infinity, i: 0, t: 0 };
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1;
      let t = ((px - ax) * dx + (py - ay) * dy) / len2;
      t = Math.max(0, Math.min(1, t));

   * measure reality ourselves: interpolate what time the schedule says the
   * train should be at its current track position and compare with the GPS fix
   * timestamp. Negative deviation clamps to 0 (trains hold when running early).
   * stops: trip's stop list in travel order [{code, time(ms)}...].
   * Returns { dev(ms), expected(ms) } or null when it can't be estimated.

  function estimateDelay(routeId, lat, lon, tsMs, stops) {
    if (!tsMs || !stops || stops.length < 2) return null;
    const { dist } = locate(routeId, lat, lon);
    const D = lineData(routeId).dist;
    const ds = stops.map(s => D[s.code]);
    let expected = null;
    for (let k = 0; k < stops.length - 1; k++) {
      const a = ds[k], b = ds[k + 1];
      if (a === b || a == null || b == null) continue;
      const f = (dist - a) / (b - a); // works for both travel directions

  function homeLeg(route, manualReturn, lastRide, now, core, liveByTrip) {

    const formatter = new Intl.DateTimeFormat("en-US", {
      timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit"

      const date = new Date(probe), key = core.serviceDateKey(probe);

        if (offset === 0 && (today?.skippedDay || skipped[profile.id])) continue;

          if (reduced && !core.SCHEDULE.sTrains.has(trip.num)) continue;

          const b = trip.stops.findIndex(stop => stop[0] === profile.to);

            tripId: trip.trip, dep, date: key, today: offset === 0, dayOffset: offset };
          if (!best || candidate.dep < best.dep) best = candidate;

    migrateLegacy, load, save, upsert, remove, blank, homeLeg, nextScheduled });

<script id="vre-alerts">
(function (g) {
  "use strict";
  const KEY = "vre-live-alerts-v1";
  const ID = /^[A-Za-z0-9_-]{1,72}$/;
  const DEFAULTS = Object.freeze({
    version: 1, enabled: false, checkIns: false, arrival: true, leaveNow: false,
    leadMinutes: 15, sound: false, vibration: false, scopeIds: null, legacyTimes: false
  });
  function normalize(raw) {
    const value = raw && typeof raw === "object" ? raw : {};
    const lead = Number(value.leadMinutes);
    const scopeIds = Array.isArray(value.scopeIds)
      ? [...new Set(value.scopeIds.filter(id => typeof id === "string" && ID.test(id)))] : null;
    return {
      version: 1, enabled: value.enabled === true, checkIns: value.checkIns === true,
      arrival: value.arrival !== false, leaveNow: value.leaveNow === true,
      leadMinutes: Number.isInteger(lead) && lead >= 5 && lead <= 90 ? lead : 15,
      sound: value.sound === true, vibration: value.vibration === true,
      scopeIds, legacyTimes: value.legacyTimes === true && scopeIds !== null
    };
  }
  function migrate(profiles) {
    const opted = (profiles || []).filter(p => p.checkInEnabled === true).map(p => p.id)
      .filter(id => typeof id === "string" && ID.test(id));
    if (!opted.length) return { ...DEFAULTS };
    // Migrate only explicit historical opt-ins. Do not register new profiles until
    // the user explicitly switches from legacy times to the global smart schedule.
    return normalize({
      enabled: true, checkIns: true, arrival: false, scopeIds: opted,
      legacyTimes: true, leadMinutes: 15
    });
  }
  function load(storage, profiles) {
    try {
      const saved = storage.getItem(KEY);
      if (saved === null) return migrate(profiles);
      const obj = JSON.parse(saved);
      if (!obj || obj.version !== 1) return { ...DEFAULTS, unsupportedVersion: true };
      return normalize(obj);
    } catch (_) { return { ...DEFAULTS, storageError: true }; }
  }
  function save(storage, record) {
    if (record.unsupportedVersion) return false;
    try {
      storage.setItem(KEY, JSON.stringify(normalize(record)));
      return true;
    } catch (_) { return false; }
  }
  function useSmartSchedule(record) {
    return normalize({ ...record, legacyTimes: false, scopeIds: null });
  }
  g.VREAlerts = Object.freeze({ KEY, DEFAULTS, normalize, migrate, load, save, useSmartSchedule });
})(typeof window !== "undefined" ? window : globalThis);
</script>

<script id="vre-leave-by">
(function (g) {
  "use strict";
  // Forecast a leave time from a confirmed commute. No polling, alarms or background work.
  const EAST = "America/New_York";
  const fmt = new Intl.DateTimeFormat("en-US", { timeZone: EAST, year: "numeric",
    month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const parts = ms => Object.fromEntries(fmt.formatToParts(new Date(ms)).map(p => [p.type, p.value]));
  // Convert an Eastern wall clock to an epoch even when the Android/device timezone differs.
  // Commute trains don't depart in the ambiguous fall-back 01:00 hour.
  function easternMinute(now, minute) {
    const p = parts(now), wall = Date.UTC(+p.year, +p.month - 1, +p.day, 0, minute);
    let guess = wall + 5 * 3600000;
    for (let i = 0; i < 4; i++) {
      const s = parts(guess);
      const read = Date.UTC(+s.year, +s.month - 1, +s.day, +s.hour, +s.minute);
      guess += wall - read;
    }
    return guess;
  }
  const finite = x => typeof x === "number" && Number.isFinite(x);
  function calculate(profile, trainNumber, core, liveByTrip, history, now) {
    if (!profile || !core || !finite(now) || !core.isServiceDay(new Date(now)))
      return { state: "no-service" };
    const trip = core.SCHEDULE.trips.find(t => String(t.num) === String(trainNumber)
      && t.stops.findIndex(s => s[0] === profile.from) >= 0
      && t.stops.findIndex(s => s[0] === profile.to) > t.stops.findIndex(s => s[0] === profile.from));
    if (!trip || !profile.preferredTrains?.includes(String(trainNumber)))
      return { state: "invalid-train" };
    const key = core.serviceDateKey(now);
    if (core.SCHEDULE.reducedService.includes(key) && !core.SCHEDULE.sTrains.has(trip.num))
      return { state: "no-service" };
    const boardingIndex = trip.stops.findIndex(s => s[0] === profile.from);
    const scheduled = easternMinute(now, trip.stops[boardingIndex][1]);
    const travel = Number(profile.travelMinutes), platform = Number(profile.platformMinutes),
      buffer = Number(profile.bufferMinutes);
    if (![travel, platform, buffer].every(n => Number.isInteger(n) && n >= 0) ||
        travel + platform <= 0)
      return { state: "needs-travel-time", scheduled };
    const lead = travel + platform + buffer;
    const live = liveByTrip?.[trip.trip] || null;
    const fresh = live && !live.ghost && !live.signalLost && finite(live.ts) &&
      live.ts <= now + 60000 && now - live.ts <= 5 * 60000;
    const liveStop = fresh ? live.stops?.find(s => s.code === profile.from) : null;
    const latestEta = finite(liveStop?.time) ? liveStop.time : null;
    const nextIndex = fresh ? live.stops?.findIndex(s => s.code === live.nextStop) : -1;
    const boardLiveIndex = fresh ? live.stops?.findIndex(s => s.code === profile.from) : -1;
    const passed = fresh && nextIndex > boardLiveIndex && boardLiveIndex >= 0;
    const positive = latestEta == null ? 0 : Math.max(0, latestEta - scheduled);
    const recent = (Array.isArray(history?.[trip.trip]) ? history[trip.trip] : [])
      .filter(s => Array.isArray(s) && finite(s[0]) && finite(s[1])
        && s[0] <= now + 60000 && now - s[0] <= 12 * 60000)
      .sort((a, b) => a[0] - b[0]);
    const last = recent.at(-1), prior = recent.slice(0,-1).reverse().find(s =>
      last && last[0] - s[0] >= 60000 && last[0] - s[0] <= 10 * 60000);
    const deviation = finite(live?.schedDev) ? live.schedDev / 60000 : NaN;
    // Avoid later departure advice from a single/deteriorating/stale GTFS fix.
    const stableDelay = positive >= 2 * 60000 && positive <= 30 * 60000 &&
      prior && last && last[1] >= 2 && prior[1] >= 2 &&
      Math.abs(last[1] - prior[1]) <= 1 &&
      last[1] >= prior[1] - 0.25 &&
      finite(deviation) && Math.abs(last[1] - deviation) <= 1.5 &&
      Math.abs(positive / 60000 - deviation) <= 2 &&
      now - last[0] <= 4 * 60000;
    let departure = scheduled, confidence = "schedule";
    if (fresh && latestEta != null && latestEta < scheduled) {
      departure = latestEta;
      confidence = "earlier-live";
    } else if (fresh && stableDelay) {
      // Maximum later leave shift is 10 min, even for larger predicted delays.
      departure += Math.min(positive, 10 * 60000);
      confidence = "stable-delay";
    } else if (fresh && positive > 0) confidence = "delay-unconfirmed";
    const leaveBy = departure - lead * 60000;
    const remaining = Math.ceil((leaveBy - now) / 60000);
    return { state: passed || now > departure + 60000 ? "departed"
      : remaining <= 0 ? "leave-now" : "upcoming",
      confidence, train: String(trip.num), boarding: profile.from, scheduled,
      predicted: latestEta, departure, leaveBy, remaining, leadMinutes: lead,
      liveFresh: !!fresh };
  }
  g.VRELeaveBy = Object.freeze({ calculate, easternMinute });
})(typeof window !== "undefined" ? window : globalThis);
</script>

      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>`;
  const AlertIcon = () => html`
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <path d="M12 9v4M12 17h.01"/>
    </svg>`;

  /* ---------------- delay trend sparkline ---------------- */
  function Sparkline({ samples }) {
    if (!samples || samples.length < 3) return null;
    const w = 130, h = 26, pad = 3;
    const t0 = samples[0][0], t1 = samples[samples.length - 1][0] || t0 + 1;
    const max = Math.max(3, ...samples.map(s => s[1]));
    const pts = samples.map(([t, d]) =>
      `${(pad + (w - 2 * pad) * (t - t0) / ((t1 - t0) || 1)).toFixed(1)},${(h - pad - (h - 2 * pad) * d / max).toFixed(1)}`).join(" ");
    return html`
      <svg width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} aria-label="Delay trend" role="img">
        <line x1=${pad} y1=${h - pad} x2=${w - pad} y2=${h - pad} stroke="var(--border)" strokeWidth="1"/>
        <polyline points=${pts} fill="none" stroke="var(--amber)" strokeWidth="1.7"
          strokeLinecap="round" strokeLinejoin="round"/>
      </svg>`;
  }

  /* ---------------- commute card ---------------- */
  function RouteSetup({ initial, onSave, onCancel }) {
    const [a, setA] = useState(initial ? initial.a : "07");
    const [b, setB] = useState(initial ? initial.b : "01");
    const served = useMemo(() => VRECore.SCHEDULE.trips.some(t => {
      const iA = t.stops.findIndex(s => s[0] === a), iB = t.stops.findIndex(s => s[0] === b);
      return iA >= 0 && iB >= 0 && iA !== iB;
    }), [a, b]);
    const sel = (val, set, label) => html`
      <label className="fld">
        <span>${label}</span>
        <select value=${val} onChange=${e => set(e.target.value)}>
          ${ALL_CODES.map(c => html`<option key=${c} value=${c}>${STATIONS[c].name}</option>`)}
        </select>
      </label>`;
    return html`
      <div style=${{ padding: "12px 16px 16px" }}>
        <div className="row" style=${{ gap: 10, alignItems: "flex-end" }}>
          ${sel(a, setA, "Home station")} ${sel(b, setB, "Destination")}
        </div>
        <div className="meta" style=${{ marginTop: 8, fontSize: 11.5, color: "var(--muted-2)" }}>
          Saved as a round trip: mornings show trains toward your destination,
          afternoons the ride home. The flip button switches anytime.</div>
        ${!served && a !== b && html`
          <div className="meta" style=${{ marginTop: 8, color: "var(--amber)" }}>
            No direct trains connect these stations.</div>`}
        <div className="row" style=${{ marginTop: 12, gap: 8 }}>
          <button className="btn" style=${{ flex: 1 }} disabled=${a === b || !served}
            onClick=${() => onSave({ a, b })}>Save my commute</button>
          ${onCancel && html`<button className="btn ghost" onClick=${onCancel}>Cancel</button>`}
        </div>
      </div>`;
  }

  /* Offline commute routines: editable preferences only, no notification or monitoring side effects. */
  function CommuteProfiles({ record, legacyRoute, onSave }) {
    const h = React.createElement;
    const [draft, setDraft] = useState(null);
    const [error, setError] = useState("");
    const [confirmRemove, setConfirmRemove] = useState(false);
    const names = VRECore.STATIONS;
    const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const stationOptions = Object.entries(names).map(([code, station]) =>
      h("option", { key: code, value: code }, station.name));
    const change = (key, value) => setDraft(old => ({ ...old, [key]: value }));
    const modifyRoute = (key, value) => setDraft(old => ({
      ...old, [key]: value, preferredTrains: []
    }));
    const begin = profile => {
      setDraft(profile ? { ...profile, preferredTrains: [...profile.preferredTrains], days: [...profile.days] }
        : VRECommutes.blank(legacyRoute && legacyRoute.a, legacyRoute && legacyRoute.b));
      setConfirmRemove(false);
      setError("");
    };
    const save = () => {
      if (!draft.name.trim()) { setError("Give this commute a name."); return; }
      if (!draft.days.length) { setError("Select at least one weekday."); return; }
      if (!VRECommutes.choices(VRECore, draft.from, draft.to).length) {
        setError("Choose stations served by a direct train."); return;
      }
      const updated = VRECommutes.upsert(record, draft, VRECore);
      if (!updated || !onSave(updated)) { setError("Could not save commute preferences on this device."); return; }
      setDraft(null);
      setError("");
    };
    const remove = () => {
      if (!confirmRemove) { setConfirmRemove(true); return; }
      if (!onSave(VRECommutes.remove(record, draft.id, VRECore))) {
        setError("Could not remove this commute."); return;
      }
      setDraft(null);
      setConfirmRemove(false);
    };
    const field = (label, child) => h("label", { className: "fld" }, h("span", null, label), child);
    const numeric = (key, label, max) => field(label, h("input", {
      type: "number", min: 0, max, step: 1, value: draft[key],
      onChange: e => change(key, e.target.value === "" ? -1 : Number(e.target.value))
    }));
    const selectStation = (key, label) => field(label, h("select", {
      value: draft[key], onChange: e => modifyRoute(key, e.target.value)
    }, stationOptions));
    const timeLabel = minutes => {
      const hour = Math.floor(minutes / 60), minute = minutes % 60;
      return String(hour % 12 || 12) + ":" + String(minute).padStart(2, "0") + (hour < 12 ? " AM" : " PM");
    };
    if (record.unsupportedVersion) return h("div", { className: "card", style: { marginTop: 12, padding: 16 } },
      h("strong", null, "Commute preferences need a newer app version."),
      h("div", { className: "meta" }, "Existing preferences have been left untouched."));
    if (!draft) return h("div", { className: "card", style: { marginTop: 12 } },
      h("div", { className: "card-h" }, "Commute routines"),
      h("div", { style: { padding: "8px 16px 14px" } },
        h("div", { className: "meta", style: { marginBottom: 10 } },
          "Save your usual routes, trains, and travel times. Daily alerts are coming in a later update."),
        record.profiles.map(p => h("div", { key: p.id, className: "row", style: {
          borderTop: "1px solid var(--border)", padding: "9px 0", alignItems: "center"
        } },
          h("div", { style: { minWidth: 0 } },
            h("strong", null, p.name),
            h("div", { className: "meta" }, names[p.from].name + " → " + names[p.to].name),
            h("div", { className: "meta" }, p.preferredTrains.length
              ? "Trains " + p.preferredTrains.join(", ") : "Select preferred trains")),
          h("button", { className: "btn ghost", onClick: () => begin(p),
            "aria-label": "Edit " + p.name }, "Edit")
        )),
        h("button", { className: "btn outline", onClick: () => begin(null),
          style: { marginTop: 8 } }, "Add commute")
      ));
    const trains = VRECommutes.choices(VRECore, draft.from, draft.to);
    const checkDay = (day, enabled) => change("days",
      enabled ? [...new Set([...draft.days, day])].sort((a, b) => a - b) : draft.days.filter(d => d !== day));
    const checkTrain = (num, enabled) => change("preferredTrains", enabled
      ? [...new Set([...draft.preferredTrains, num])] : draft.preferredTrains.filter(t => t !== num));
    const selectMode = field("How you get there", h("select", { value: draft.mode, onChange: e => change("mode", e.target.value) },
      h("option", { value: "walk" }, "Walk"), h("option", { value: "drive" }, "Drive"),
      h("option", { value: "other" }, "Other")));
    return h("div", { className: "card", style: { marginTop: 12 } },
      h("div", { className: "card-h" }, "Edit commute routine"),
      h("div", { style: { padding: 16, display: "grid", gap: 12 } },
        field("Name", h("input", { type: "text", maxLength: 48,
          value: draft.name, onChange: e => change("name", e.target.value) })),
        h("div", { className: "row", style: { gap: 8 } },
          selectStation("from", "Board at"), selectStation("to", "Get off at")),
        h("div", { className: "meta" }, "Preferred trains (select one or more)"),
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: 8, maxHeight: 170, overflowY: "auto" } },
          trains.length ? trains.map(t => h("label", { key: t.num, className: "chip",
            style: { display: "flex", alignItems: "center", gap: 6 } },
            h("input", { type: "checkbox", checked: draft.preferredTrains.includes(t.num),
              onChange: e => checkTrain(t.num, e.target.checked) }),
            t.num + " · " + timeLabel(t.departureMinutes))) :
            h("span", { className: "stale-note" }, "No direct trains for this route.")),
        selectMode,
        h("div", { className: "row", style: { gap: 8 } },
          numeric("travelMinutes", "Travel (min)", 180),
          numeric("platformMinutes", "To platform (min)", 60),
          numeric("bufferMinutes", "Safety (min)", 60)),
        h("div", { className: "meta" }, "Typical commuting days"),
        h("div", { style: { display: "flex", flexWrap: "wrap", gap: 9 } },
          days.map((label, day) => h("label", { key: day, className: "chip",
            style: { display: "flex", alignItems: "center", gap: 5 } },
            h("input", { type: "checkbox", checked: draft.days.includes(day),
              onChange: e => checkDay(day, e.target.checked) }), label))),
        h("div", { className: "meta" },
          "Notification choices are in Preferences → Check-ins & Alerts. Leave-by estimates show after you choose a train; background departure alerts aren't active yet."),
        error ? h("div", { className: "stale-note", role: "alert" }, error) : null,
        h("div", { className: "row", style: { gap: 8 } },
          h("button", { className: "btn", onClick: save }, "Save commute"),
          h("button", { className: "btn outline", onClick: () => { setDraft(null); setError(""); } }, "Cancel")),
        record.profiles.some(p => p.id === draft.id) ? h("button", {
          className: "btn ghost", style: { color: "var(--red)", alignSelf: "start" }, onClick: remove
        }, confirmRemove ? "Confirm remove commute" : "Remove commute") : null
      ));
  }

  /* Read-only leave estimate for an explicitly chosen train; never activates monitoring. */
  function LeaveByCard({ profile, train, forecast }) {
    const time = ms => new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York",
      hour: "numeric", minute: "2-digit" }).format(new Date(ms));
    if (forecast.state === "needs-travel-time") return html`
      <div className="leave-by-card">
        <strong>Train ${train} · travel time needed</strong>
        <div className="meta">Set the minutes to reach the platform in Preferences → Advanced Commute.</div>
      </div>`;
    if (forecast.state === "no-service" || forecast.state === "invalid-train") return html`
      <div className="leave-by-card"><div className="meta">
        This train isn't scheduled for your saved commute today.
      </div></div>`;
    const departed = forecast.state === "departed";
    const urgent = forecast.state === "leave-now";
    const confidence = forecast.confidence === "stable-delay"
      ? "Delay verified across updates · departure buffer capped at 10 min"
      : forecast.confidence === "earlier-live"
        ? "Earlier live prediction · leave time moved forward"
        : forecast.confidence === "delay-unconfirmed"
          ? "Train appears delayed, but keep the original leave time until confirmed"
          : "Timetable-based leave time · live delays not yet verified";
    return html`
      <div className="leave-by-card" aria-label=${"Leave-by estimate for train " + train}>
        <div className="leave-by-label">${departed ? "Departure time passed" : urgent ? "Leave now for your station" : "Leave for your station by"}</div>
        <div className="leave-by-time" aria-label=${"Recommended leave time: " + time(forecast.leaveBy)}>
          ${time(forecast.leaveBy)}
        </div>
        <div className="meta">Train ${train} departs ${time(forecast.scheduled)} ·
          ${forecast.leadMinutes} min travel + buffer
        </div>
        ${!departed && !urgent && html`<div className="leave-by-remaining">
          ${forecast.remaining} min until you should leave
        </div>`}
        <div className="meta leave-by-confidence">${confidence}</div>
        <div className="meta">Calculated while the app is open. Automatic leave-time notifications are coming later.</div>
      </div>`;
  }

  function DailyTravelControl({ profile, override, onChange }) {
    const current = override == null ? profile.travelMinutes : override;
    return html`
      <div className="daily-travel-control">
        <label for=${"travel-" + profile.id}>Travel time today</label>
        <input id=${"travel-" + profile.id} type="number" min="0" max="180"
          step="1" inputMode="numeric" value=${current}
          onChange=${e => {
            const n = Number(e.target.value);
            if (e.target.value === "") { onChange(null); return; }
            if (Number.isInteger(n) && n >= 0 && n <= 180) onChange(n);
          }} />
        <span>min</span>
        ${override != null && html`
          <button type="button" className="btn ghost" onClick=${() => onChange(null)}>
            Reset
          </button>`}
      </div>`;
  }

  /* One primary recommendation for the home card; never mix yesterday's plans into today. */
  function primaryPlannedCommute(profiles, day, now, liveByTrip, samples, overrides) {
    if (!profiles.length || !isServiceDay(new Date(now))) return null;
    const dateKey = VRECore.serviceDateKey(now);
    const todayState = day?.date === dateKey ? day : null;
    const planned = todayState?.planned || {};
    const skipped = todayState?.skippedTrips || {};
    const upcoming = profiles.map(p => {
      const train = planned[p.id];
      if (!train || skipped[p.id]) return null;
      const travel = overrides[p.id] ?? p.travelMinutes;
      const forecast = VRELeaveBy.calculate({
        ...p, travelMinutes: Number.isInteger(travel) && travel > 0 ? travel : 10
      }, train, VRECore, liveByTrip, samples, now);
      return { profile: p, train, forecast };
    }).filter(x => x && ["upcoming", "leave-now", "needs-travel-time"].includes(x.forecast.state))
      .sort((a, b) => (a.forecast.leaveBy ?? Infinity) - (b.forecast.leaveBy ?? Infinity));
    return upcoming.length ? { ...upcoming[0], otherCount: upcoming.length - 1 } : null;
  }

  /* Android-only, device-local commute choice. This does NOT start ride monitoring. */
  function TodayCommute({ profiles, day, selectedId, onSelect, onAction, now, liveByTrip, samples, overrides, onTravelChange }) {
    if (!profiles.length) return null;
    const dateKey = VRECore.serviceDateKey(now);
    if (!isServiceDay(new Date(now))) return null;
    const selected = profiles.find(p => p.id === selectedId);
    const skippedDay = !!(day?.date === dateKey && day?.skippedDay);
    // An Android bridge response from yesterday must never show today's old plans.
    const todayState = day?.date === dateKey ? day : null;
    const planned = todayState?.planned || {};
    const skipped = todayState?.skippedTrips || {};
    const easternClock = Object.fromEntries(serviceClock.formatToParts(new Date(now))
      .map(p => [p.type, p.value]));
    const currentMinutes = Number(easternClock.hour) * 60 + Number(easternClock.minute);
    const reduced = VRECore.SCHEDULE.reducedService.includes(dateKey);
    const options = selected ? VRECommutes.choices(VRECore, selected.from, selected.to)
      .filter(t => selected.preferredTrains.includes(t.num) &&
        (!reduced || VRECore.SCHEDULE.sTrains.has(t.num))) : [];
    const timeLabel = minutes => {
      const hour = Math.floor(minutes / 60);
      return String(hour % 12 || 12) + ":" + String(minutes % 60).padStart(2, "0") +
        (hour < 12 ? " AM" : " PM");
    };
    // No active plan: keep the main screen focused on next departures.
    // Full multi-profile choices only open after a direct "Plan train" action.
    if (selectedId === null) return null;
    return html`
      <div className="card today-commute">
        <div className="card-h">Today's commute</div>
        <div className="today-body">
          ${skippedDay && !selected ? html`
            <div className="meta">You marked today as a non-riding day. You can change that below.</div>`
          : null}
          ${selected ? html`
            <button className="btn ghost today-back" onClick=${() => onSelect("")}>‹ All commutes</button>
            <div className="today-head">
              <strong>${selected.name}</strong>
              <span className="meta">${STATIONS[selected.from].name} → ${STATIONS[selected.to].name}</span>
            </div>
            ${options.filter(t => t.departureMinutes >= currentMinutes - 2).length
              ? options.filter(t => t.departureMinutes >= currentMinutes - 2).map(t => {
                const leave = VRELeaveBy.calculate({
                  ...selected, travelMinutes: overrides[selected.id] ?? selected.travelMinutes
                }, t.num, VRECore, liveByTrip, samples, now);
                return html`
                <button key=${t.num} className="today-train" onClick=${() => {
                  onAction("plan", selected.id, t.num); onSelect(null);
                }}>
                  <span>Train ${t.num}<small className="today-train-leave">${leave.leaveBy != null ?
                    (leave.state === "departed" ? "Departure passed" : "Leave by " + new Intl.DateTimeFormat("en-US", {
                      timeZone: "America/New_York", hour: "numeric", minute: "2-digit"
                    }).format(new Date(leave.leaveBy))) : "Set travel time in Advanced Commute"}</small></span>
                  <span>${timeLabel(t.departureMinutes)} <span aria-hidden="true">›</span></span>
                </button>`;
              })
              : html`<div className="meta">No preferred departures remain today.</div>`}
            <div className="meta today-footnote">
              Choosing a train shows a leave-by estimate. Live background reminders are not enabled yet.
            </div>
            <button className="btn ghost" onClick=${() => { onAction("skipTrip", selected.id); onSelect(null); }}>
              Skip this trip
            </button>`
          : html`
            ${profiles.map(p => html`
              <div className="today-row" key=${p.id}>
                <div>
                  <strong>${p.name}</strong>
                  <div className="meta">${STATIONS[p.from].name} → ${STATIONS[p.to].name}</div>
                  ${planned[p.id]
                    ? html`
                      <${LeaveByCard} profile=${p} train=${planned[p.id]}
                        forecast=${VRELeaveBy.calculate({
                          ...p, travelMinutes: overrides[p.id] ?? p.travelMinutes
                        }, planned[p.id], VRECore, liveByTrip, samples, now)} />
                      <${DailyTravelControl} profile=${p} override=${overrides[p.id]}
                        onChange=${value => onTravelChange(p.id, value)} />`
                    : skipped[p.id]
                      ? html`<div className="meta">Skipped today</div>`
                      : null}
                </div>
                <button className="btn outline today-plan" onClick=${() => {
                    if (skippedDay || skipped[p.id]) onAction("reactivate", p.id);
                    onSelect(p.id);
                  }}>
                  ${planned[p.id] ? "Change" : "Choose train"}
                </button>
              </div>`)}
            <div className="today-actions">
              <button className="btn ghost today-skip" onClick=${() => {
                onAction("skipToday", ""); onSelect(null);
              }}>Not riding today</button>
              <button className="btn ghost" onClick=${() => onSelect(null)}>Done</button>
            </div>`}
        </div>
      </div>`;
  }

  /* One app-wide notification policy; Android channels still respect system overrides. */
  function GlobalAlertSettings({ settings, onSave, osAllowed }) {
    const nativeCheckIns = typeof window.VreCommutePrefs !== "undefined";
    const [pairState, setPairState] = useState({ paired: false, ready: false });
    useEffect(() => {
      const bridge = window.VrePushPair;
      if (!bridge) return;
      bridge.onmessage = event => {
        try {
          const payload = JSON.parse(event.data);
          if (typeof payload.paired === "boolean")
            setPairState({ paired: payload.paired, ready: true });
        } catch (_) {}
      };
      bridge.postMessage("status");
      return () => { bridge.onmessage = null; };
    }, []);
    const update = (key, value) => {
      if (settings.unsupportedVersion) return;
      const proposed = VREAlerts.normalize({ ...settings, [key]: value,
        ...(key === "enabled" && !value ? { leaveNow: false } : {}) });
      onSave(key === "checkIns" && value ? VREAlerts.useSmartSchedule(proposed) : proposed);
    };
    const control = (label, detail, checked, onChange, disabled = false) => html`
      <label className="global-alert-row">
        <span className="global-alert-copy"><strong>${label}</strong><small>${detail}</small></span>
        <input type="checkbox" checked=${checked} disabled=${disabled}
          onChange=${e => onChange(e.target.checked)} />
      </label>`;
    return html`
      <div className="card">
        <div className="card-h">Check-ins & Alerts</div>
        <div className="global-alert-body">
          ${settings.unsupportedVersion ? html`
            <div className="stale-note">These settings require a newer version. Existing settings were preserved.</div>`
          : html`
            ${control("Notifications", "Master control for check-ins, commute alerts, and arrival alerts",
              settings.enabled, value => update("enabled", value))}
            ${typeof window.VreCommutePrefs !== "undefined" && osAllowed === false && html`
              <div className="stale-note">Android notifications are disabled. Allow them in system settings to receive alerts.</div>`}
            ${control("Ask if I'm taking the train", "One check-in before your usual leave time",
              settings.checkIns, value => update("checkIns", value),
              !settings.enabled || !nativeCheckIns)}
            ${!nativeCheckIns && html`<div className="meta">
              Daily check-in notifications are scheduled by the Android app.
            </div>`}
            ${settings.enabled && settings.checkIns && html`
              <label className="fld global-alert-lead">
                <span>Ask before I need to leave</span>
                <select value=${settings.leadMinutes}
                  onChange=${e => update("leadMinutes", Number(e.target.value))}>
                  ${[5, 10, 15, 20, 30, 45, 60].map(n =>
                    html`<option key=${n} value=${n}>${n} minutes</option>`)}
                </select>
              </label>`}
            ${settings.legacyTimes && settings.enabled && settings.checkIns && html`
              <div className="global-alert-migrate">
                <div className="meta">Your previously enabled check-ins still use their original times and selected commutes.</div>
                <button className="btn outline" onClick=${() => onSave(VREAlerts.useSmartSchedule(settings))}>
                  Use automatic check-in timing for all commutes
                </button>
              </div>`}
            ${control("Arrival alerts when riding", "New rides start with the in-ride bell on. You can turn it off for one ride.",
              settings.arrival, value => update("arrival", value), !settings.enabled)}
            ${nativeCheckIns && html`
              <div className="global-alert-migrate">
                <strong>Event-driven leave-now alerts</strong>
                <div className="meta">Connect this phone once to receive leave-now notices for trains you explicitly select.</div>
                ${pairState.paired ? html`
                  <div className="meta">This phone is paired with the preview monitor.</div>
                  <button className="btn outline" onClick=${() => {
                    onSave(VREAlerts.normalize({ ...settings, leaveNow: false }));
                    window.VrePushPair?.postMessage("unpair");
                  }}>Unpair this phone</button>
                ` : html`
                  <button className="btn outline" disabled=${!settings.enabled}
                    onClick=${() => window.VrePushPair?.postMessage("pair")}>Pair this phone</button>
                `}
              </div>`}
            ${control("Leave-now notifications", "Only for confirmed trains, using the shared Cloudflare monitor",
              !!settings.leaveNow, value => update("leaveNow", value),
              !settings.enabled || !pairState.paired || !nativeCheckIns)}
            <div className="global-alert-section">Commute notification style</div>
            ${nativeCheckIns ? html`

  /* ---------------- notifications (all local, zero network) ---------------- */
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  }
  function chime() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    [880, 1174.66].forEach((f, i) => {
      const o = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t + i * 0.18);
      gn.gain.exponentialRampToValueAtTime(0.12, t + i * 0.18 + 0.03);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.55);
      o.connect(gn); gn.connect(audioCtx.destination);
      o.start(t + i * 0.18); o.stop(t + i * 0.18 + 0.6);
    });
  }
  async function fireAlert(title, body) {
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) {}
    chime();
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
        if (reg && reg.showNotification) reg.showNotification(title, { body, tag: "vre-eta" });
        else new Notification(title, { body });
      }
    } catch (_) {}
  }
  const androidRideAlert = window.VreRideAlert;
  const canNotify = "Notification" in window;
  const canPush = "PushManager" in window && "serviceWorker" in navigator;
  const canWake = "wakeLock" in navigator;

  /* ---- background push: worker cron watches the ride and pushes even when closed ---- */
  const b64ToU8 = s => {
    const pad = "=".repeat((4 - s.length % 4) % 4);
    const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  };
  /** Returns null on success, or a short human-readable failure reason. */
  async function pushSubscribe(train, destCode) {
    if (!canPush) return "no push support in this browser";
    try {
      const kr = await fetch("push/key", { cache: "no-store" });
      if (kr.status === 501) return "server push not configured";
      if (!kr.ok) return "server error " + kr.status;
      const { key } = await kr.json();
      const reg = await navigator.serviceWorker.ready;
      let sub;
      try {
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
      } catch (e) {
        // stale subscription with a different key: drop and retry once
        if (e && e.name === "InvalidStateError") {
          const old = await reg.pushManager.getSubscription();
          if (old) await old.unsubscribe();
          sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
        } else throw e;
      }
      const r = await fetch("push/subscribe", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          sub: sub.toJSON(), tripId: train.tripId, dest: destCode,
          destName: STATIONS[destCode].name, lead: alertLead(train, destCode),
        }),
      });
      return r.ok ? null : "server error " + r.status;
    } catch (e) { return (e && (e.name || e.message)) || "subscribe failed"; }
  }
  async function pushUnsubscribe() {
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) await fetch("push/unsubscribe", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ endpoint: sub.endpoint }),
      });
    } catch (_) {}
  }

  /* ---------------- map ---------------- */
  function linePath(codes, dx) {
    return codes.map((c, i) => `${i ? "L" : "M"}${STATIONS[c].x + (i < 4 ? dx : 0)},${STATIONS[c].y}`).join(" ");
  }
  const PATH_F = linePath(LINE_F, 2.5);
  const PATH_M = linePath(LINE_M, -2.5);

  function mapLabelBoxes() {
    return Object.entries(STATIONS).map(([code, s]) => {
      const left = LINE_M.indexOf(code) > 3, width = s.name.length * 6.3;
      return { x: s.x + (left ? -13 - width : 13) - 5, y: s.y - 11, w: width + 10, h: 20 };
    });
  }
  function focusLayout(train) {
    const w = 104, h = 54, labels = mapLabelBoxes();
    const rightFirst = train.line === "M" && train.y > STATIONS["04"].y;
    const xs = rightFirst ? [train.x + 36, train.x - w - 36] : [train.x - w - 36, train.x + 36];
    let card;
    for (const dy of [0, -48, 48, -96, 96, -144, 144]) {
      for (const rawX of xs) {
        const b = { x: Math.max(14,Math.min(376-w,rawX)), y: Math.max(14,Math.min(686-h,train.y-h/2+dy)), w, h };
        if (!labels.some(l => b.x-5 < l.x+l.w && b.x+b.w+5 > l.x && b.y-5 < l.y+l.h && b.y+b.h+5 > l.y)) { card=b; break; }
      }
      if (card) break;
    }
    card = card || { x: 14, y: 14, w, h };
    const left = Math.min(card.x-8,train.x-10), top = Math.min(card.y-8,train.y-18);
    const right = Math.max(card.x+w+8,train.x+10), bottom = Math.max(card.y+h+8,train.y+18);
    return { card, frame: { x: left, y: top, w: right-left, h: bottom-top } };
  }

  // Reserve the active focus panel while separating other train badges.
  function layoutMarkers(markers, reserved = []) {
    const labels = [...mapLabelBoxes(), ...reserved];
    const occupied = [], positions = Object.create(null);
    for (const marker of [...markers].sort((a,b) => String(a.tripId).localeCompare(String(b.tripId)))) {
      const side = marker.line === "M" && marker.y > STATIONS["04"].y ? 1 : -1;
      const baseX = marker.x + side * (marker.active ? 60 : 36);
      const candidates = [];
      for (let ix = -5; ix <= 5; ix++) for (let iy = -10; iy <= 10; iy++) {
        const x = Math.max(32, Math.min(358, baseX + ix * 64));
        const y = Math.max(32, Math.min(668, marker.y + iy * 64));
        candidates.push({ x, y, score: (x-baseX)**2 + (y-marker.y)**2 });
      }
      candidates.sort((a,b) => a.score - b.score || a.x - b.x || a.y - b.y);
      const intersects = p => labels.some(b => p.x + 31 > b.x && p.x - 31 < b.x+b.w
        && p.y + 31 > b.y && p.y - 31 < b.y+b.h);
      const position = candidates.find(p => !intersects(p) && occupied.every(q => Math.abs(p.x-q.x) >= 64 || Math.abs(p.y-q.y) >= 64));
      // Keep all trains selectable even in unusually dense service.
      const chosen = position || candidates.find(p => occupied.every(q => Math.hypot(p.x-q.x,p.y-q.y) >= 44)) || candidates[0];
      positions[marker.tripId] = chosen;
      occupied.push(chosen);
    }
    return positions;
  }

  /* ---------------- schedule card ---------------- */
  function ScheduleCard({ rows, now, onPickLive }) {
    const [dir, setDir] = useState(() => new Date(now).getHours() < 12 ? 1 : 0); // AM: to DC

    // live-first: running trains pinned on top, then the now line, then upcoming;
    // finished trains collapse into a stub at the bottom
    const running = shown.filter(r => r.status === "live" || r.status === "quiet")
      .sort((a, b) => a.first - b.first);
    const upcoming = shown.filter(r => r.status === "soon" || r.status === "none");
    const earlier = shown.filter(r => r.status === "done");

    const statusChip = r => {
      if (r.status === "live") {

        const late = next && next.delay != null && next.delay >= 120;

        return html`<${React.Fragment}>
          <span className="badge ok"><span className="livedot"></span>${next ? fmtWhen(next.time, now).replace("in ", "") : "live"}</span>
          ${late && html`<span className="badge late">+${Math.round(next.delay / 60)}m</span>`}
        <//>`;
      }
      if (r.status === "soon") return html`<span className="badge">${fmtWhen(r.first, now)}</span>`;
      if (r.status === "quiet") return html`<span className="badge dim">no signal</span>`;
      if (r.status === "none") return html`<span className="badge dim">${fmtClock(r.first)}</span>`;
      return html`<span className="badge dim">done</span>`;
    };

    const renderRow = r => {
      const origin = STATIONS[r.stops[0][0]].name;

  /* ---------------- Marey string diagram: the commute in time-space ---------------- */
  function Marey({ from, to, deps, liveByTrip, now }) {
    if (!deps.length) return null;
    // station axis: the codes between from & to in travel order, spaced by real km
    const lineCodes = (LINE_F.includes(from) && LINE_F.includes(to)) ? LINE_F : LINE_M;
    const iA = lineCodes.indexOf(from), iB = lineCodes.indexOf(to);
    if (iA < 0 || iB < 0 || iA === iB) return null;
    const seq = iA < iB ? lineCodes.slice(iA, iB + 1) : lineCodes.slice(iB, iA + 1).reverse();
    const kmAt = [0];
    for (let i = 1; i < seq.length; i++) {
      const A = STATIONS[seq[i - 1]], B = STATIONS[seq[i]];
      const dx = (B.lon - A.lon) * 86.8, dy = (B.lat - A.lat) * 111;
      kmAt.push(kmAt[i - 1] + Math.hypot(dx, dy));
    }
    const totalKm = kmAt[kmAt.length - 1] || 1;

    // left gutter keeps station labels out of the plot; bottom band holds the time axis
    const W = 340, H = 158, L = 64, R = 12, T = 16, B = 24;
    const t0 = now - 6 * 60000;
    const t1 = Math.max(...deps.map(d => d.arr)) + 4 * 60000;
    const X = t => L + (W - L - R) * (t - t0) / (t1 - t0);
    const Y = i => T + (H - T - B) * kmAt[i] / totalKm;
    const yOf = code => Y(seq.indexOf(code));
    const nowX = X(now);

    // time ticks every 20 min, skipping any that would crowd the now line
    const tickFmt = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      .replace(/\s?[AP]M/i, "");
    const ticks = [];
    for (let t = Math.ceil(t0 / 1200000) * 1200000; t <= t1; t += 1200000)
      if (Math.abs(X(t) - nowX) > 26) ticks.push(t);

    const stopsOf = dep => {
      const live = liveByTrip && liveByTrip[dep.trip];
      const all = live ? live.stops
        : schedStopsMs(VRECore.SCHEDULE.trips.find(t => t.trip === dep.trip), now);
      return all.filter(s => seq.includes(s.code));
    };
    const gutterName = name => name.length > 10 ? name.slice(0, 9) + "…" : name;

    return html`
      <div>
        <div className="marey-cap">${STATIONS[from].name} → ${STATIONS[to].name}</div>
        <div className="marey-legend">
          <span><i className="sw"></i>live</span>
          <span><i className="sw dashed"></i>scheduled</span>
          <span><i className="sw nowsw"></i>now</span>
          <span style=${{ marginLeft: "auto" }}>stations ↓ · time →</span>
        </div>
        <svg viewBox=${`0 0 ${W} ${H}`} style=${{ width: "100%", height: "auto" }}
          role="img" aria-label="Time-space diagram: stations vertically by distance, time horizontally, each train a line">
          ${seq.map((c, i) => {
            const ends = i === 0 || i === seq.length - 1;
            return html`
              <g key=${c}>
                <line x1=${L} y1=${Y(i)} x2=${W - R} y2=${Y(i)} stroke="var(--border)" strokeWidth="0.7"/>
                <circle cx=${L} cy=${Y(i)} r=${ends ? 2.6 : 1.5}
                  fill=${ends ? "var(--map-label-major)" : "var(--muted-2)"}/>
                <text x=${L - 7} y=${Y(i) + 3} fontSize=${ends ? 8.5 : 7} textAnchor="end"
                  fill=${ends ? "var(--map-label-major)" : "var(--muted-2)"} fontWeight=${ends ? 600 : 400}>
                  ${ends ? gutterName(STATIONS[c].name) : ""}</text>
              </g>`;
          })}
          <line x1=${L} y1=${H - B} x2=${W - R} y2=${H - B} stroke="var(--border)" strokeWidth="0.8"/>
          ${ticks.map(t => html`
            <g key=${t}>
              <line x1=${X(t)} y1=${H - B} x2=${X(t)} y2=${H - B + 3.5} stroke="var(--muted-2)" strokeWidth="0.8"/>
              <text x=${X(t)} y=${H - 6} fontSize="7.5" fill="var(--muted-2)" textAnchor="middle">${tickFmt(t)}</text>
            </g>`)}
          <line x1=${nowX} y1=${T} x2=${nowX} y2=${H - B} stroke="var(--green)" strokeWidth="1" strokeDasharray="3 2.5"/>
          <text x=${Math.max(L + 14, Math.min(nowX, W - 18))} y=${T - 5} fontSize="8"
            fill="var(--green)" textAnchor="middle" fontWeight="700">now</text>
          ${deps.map(dep => {
            const pts = stopsOf(dep).map(s => [X(s.time), yOf(s.code)]);
            if (pts.length < 2) return null;
            const c = LINE_COLOR[dep.line];
            // live position: interpolate where the train is at "now"
            let dot = null;
            const st = stopsOf(dep);
            for (let i = 0; i < st.length - 1; i++) {
              if (now >= st[i].time && now <= st[i + 1].time) {
                const f = (now - st[i].time) / ((st[i + 1].time - st[i].time) || 1);
                dot = [X(now), yOf(st[i].code) + f * (yOf(st[i + 1].code) - yOf(st[i].code))];
                break;
              }
            }
            return html`
              <g key=${dep.trip}>
                <polyline points=${pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" ")}
                  fill="none" stroke=${c} strokeWidth=${dep.live ? 2 : 1.3}
                  strokeDasharray=${dep.live ? "" : "4 3"} strokeLinejoin="round" strokeLinecap="round"
                  opacity=${dep.live ? 0.95 : 0.6}/>
                <text x=${Math.max(L + 2, Math.min(pts[0][0] + 3, W - 24))} y=${Math.max(T + 8, pts[0][1] - 3.5)}
                  fontSize="8" fill=${c} fontWeight="700">${dep.num}</text>
                ${dep.live && dot && html`
                  <circle cx=${dot[0]} cy=${dot[1]} r="3.4" fill=${c} stroke="var(--map-ink)" strokeWidth="1.2"/>`}
              </g>`;
          })}
        </svg>
      </div>`;

  /* Countdown to the station where the commuter plans to board, not the destination. */
  function waitingArrival(waiting, train, now) {
    if (!waiting) return { phase: "unavailable", eta: null, minutes: null, source: "none" };
    const stop = train?.stops?.find(s => s.code === waiting.dest);
    const fresh = !!train && !train.ghost && !train.signalLost && Number.isFinite(train.ts) &&
      now - train.ts >= -60000 && now - train.ts <= 5 * 60000;
    const scheduled = Number.isFinite(waiting.scheduled) ? waiting.scheduled : null;
    const liveEta = fresh && Number.isFinite(stop?.time) ? stop.time : null;
    const eta = liveEta ?? scheduled ?? (Number.isFinite(stop?.time) ? stop.time : null);
    const source = liveEta != null ? "live" : eta != null ? "schedule" : "none";
    if (eta == null) return { phase: "unavailable", eta: null, minutes: null, source };
    const phase = liveEta != null ? VRECore.rideStatus(train, waiting.dest, now).phase : null;
    if (phase === "atStop") return { phase: "atStation", eta, minutes: 0, source };
    if (phase === "passed") return { phase: "passed", eta, minutes: null, source };
    const left = eta - now;
    if (left < -90000) return { phase: "overdue", eta, minutes: null, source };
    if (left <= 0) return { phase: "due", eta, minutes: 0, source };
    return { phase: "approaching", eta, minutes: Math.max(1, Math.ceil(left / 60000)), source };
  }

        (clean.checkIns && !alertPrefs.checkIns) ||
        (clean.arrival && !alertPrefs.arrival));

    const todayKey = VRECore.serviceDateKey(now);

    const saveTravelOverride = (profileId, value) => {
      if (value != null && (!Number.isInteger(value) || value < 0 || value > 180)) return;
      const update = { ...todayTravel };
      if (value == null) delete update[profileId];
      else update[profileId] = value;
      const record = { date: VRECore.serviceDateKey(Date.now()), values: update };
      lsSet("vre-leave-day-overrides-v1", record);

                <div key=${i} className="meta" style=${{ marginTop: 7 }}>
                  <b>${a.effect}${a.routes.length ? " · " + a.routes.map(r => r === "4" ? "MSS" : "FBG").join(", ") : ""}</b>
                  ${a.header ? ` — ${a.header}` : ""}
                  ${a.desc && a.desc !== a.header && html`
                    <div style=${{ marginTop: 2, color: "var(--muted-2)" }}>${a.desc}</div>`}
                </div>`)}
            </div>
          </div>`}

        ${waitingFor && !myTrip && html`
          <${WaitingCard} waiting=${waitingFor} train=${liveByTrip[waitingFor.trip] || null} now=${now}
            onBoard=${() => { setSelected(waitingFor.trip); setPicking(true); }}
            onStop=${() => setWaitingFor(null)}
            lockButton=${lockControl(false)} lockError=${lockError} />`}
        ${summary && html`<${SummaryCard} rec=${summary} onDismiss=${() => setSummary(null)} />`}

        ${myTrip && html`
          <div style=${{ marginBottom: 12 }}>
            <${EtaBanner} train=${myTrain} dest=${myTrip.dest} notify=${!!myTrip.notify}
              pushActive=${!!myTrip.push} pushErr=${myTrip.pushErr || null} wake=${!!myTrip.wake} now=${now}
              onNotify=${toggleNotify} onWake=${toggleWake}
              onChange=${() => { if (myTrain) { setSelected(myTrain.tripId); setPicking(true); } }}
              onSwitchTrain=${() => { setSelected(null); setSwitchTrainOpen(true); }}
              onLeave=${finishRide} lockButton=${lockControl(true)}
              lockActive=${lockState === "on"} lockError=${lockError} />
          </div>`}

        ${planProfile !== null && todayCard}

        ${!myTrip && tab !== "preferences" && planProfile === null && html`
          <div style=${{ marginBottom: 12 }}>
            ${homeLeg
              ? html`<${CommuteCard}
                  from=${homeLeg.from} to=${homeLeg.to}
                  returning=${!primaryPlan && homeLeg.returning}
                  now=${now} liveByTrip=${liveByTrip}
                  planned=${primaryPlan} nextAdvanced=${featuredAdvanced}
                  travelOverride=${planOverride}
                  onFlip=${() => setFlipDir(!homeLeg.returning)}
                  onPlanTrain=${confirmInlinePlan} />`
              : html`<div className="card">
                  <div className="card-h">Set up your commute</div>
                  <p className="pref-description">Save your usual stations to show your next departures here.</p>
                  <div style=${{ padding: "0 16px 16px" }}>
                    <button className="btn" onClick=${() => {
                      setPreferencesSection("commute"); setTab("preferences");
                    }}>Set up commute</button>
                  </div>
                </div>`}
          </div>`}


        ${tab === "preferences" ? html`
          <${PreferencesPanel} section=${preferencesSection} onSection=${setPreferencesSection}
            route=${route} commutes=${commutes} onSaveCommutes=${saveCommutes}
            alertPrefs=${alertPrefs} onSaveAlerts=${saveAlertPrefs}
            osAllowed=${commuteDay?.notificationsAllowed}
            theme=${theme} onThemeChange=${setTheme}
            onSaveRoute=${r => {
              lsSet(ROUTE_KEY, r); setRoute(r); setFlipDir(null);
            }} />`
        : tab === "map" ? html`
          <div className="card">
            <div className="card-h">System map · ${trains.length} train${trains.length === 1 ? "" : "s"} reporting</div>
            <div className="map-wrap">
              ${data
                ? (trains.length || ghostTrains.length)
                  ? html`<${Map} trains=${trains} ghosts=${ghostTrains} selected=${selected}
                      myTripId=${myTrain && myTrain.tripId} myTrain=${myTrain} ride=${ride} now=${now} onPick=${pick} />`
                  : html`<div className="empty">No trains reporting right now.<br/>VRE runs weekday commuter service.</div>`
                : html`<div className="empty">${servicePaused ? "Live refresh is paused. Check Schedule or refresh below." : error || "Loading live data…"}</div>`}
            </div>
            <div className="map-legend" aria-label="Map marker legend">
              <span><i className="map-key solid" aria-hidden="true"></i>Live feed</span>
              <span><i className="map-key scheduled" aria-hidden="true"></i>Timetable estimate</span>
              <span className="map-position-note">Frame: your train · dashed marker: estimated position.</span>
            </div>
          </div>`
        : tab === "sched" ? html`
          <div className="card">
            <div className="card-h">Today's schedule</div>
            <${ScheduleCard} rows=${schedRows} now=${now} onPickLive=${id => { pick(id); }} />
          </div>`
        : html`
          <div className="card">
            <div className="card-h">Departure board</div>
            <${BoardCard} station=${boardSta} rows=${boardRows} now=${now}
              onStation=${setBoardSta} onPickLive=${id => { pick(id); }} />
          </div>`}

        ${error && html`<div className="err">${error}</div>`}

        <div className="foot">
          <span>Feed ${data && data.feedTs ? "stamped " + fmtClock(data.feedTs) : ""}</span>
          <button className="btn ghost" onClick=${() => refresh()}
            disabled=${now - lastFetch.current < MIN_FETCH_GAP}>
            ${now - lastFetch.current < MIN_FETCH_GAP
              ? `refresh in ${Math.ceil((MIN_FETCH_GAP - (now - lastFetch.current)) / 1000)}s`
              : "refresh now"}</button>
        </div>

${switchTrainOpen && myTrip && html`
          <${SwitchTrainSheet} rows=${schedRows} currentTrain=${myTrain} now=${now}
            onPick=${tripId => {
              setSwitchTrainOpen(false); setSelected(tripId); setPicking(false);
            }}
            onBrowse=${() => {
              setSwitchTrainOpen(false); setSelected(null); setTab("sched");
            }}
            onClose=${() => setSwitchTrainOpen(false)} />`}

        ${selTrain && html`
          <${Sheet} key=${selTrain.tripId} train=${selTrain} picking=${picking} now=${now}
            activeTrip=${myTrip} busy=${rideBusy} error=${rideStartError}
            boardingStation=${waitingFor?.trip === selTrain.tripId ? waitingFor.dest : null}
            defaultDest=${primaryPlan?.profile.to || homeLeg?.to || null}
            devSamples=${devlog[selTrain.tripId]}
            onBoard=${() => setPicking(true)}
            onWait=${code => {
              const scheduled = VRECore.SCHEDULE.trips.find(t => t.trip === selTrain.tripId);
              setWaitingFor({ trip: selTrain.tripId, num: selTrain.num, dest: code, started: Date.now(),
                scheduled: scheduled ? schedStopsMs(scheduled, now).find(s => s.code === code)?.time : null });
              setSelected(null); setPicking(false);
            }}
            onDest=${startRide}
            onClose=${() => { setSelected(null); setPicking(false); }} />`}
      </div>`;
  }

  // exposed for the node render test (test_render.mjs)
  window.__VRE_APP = { mapLabelBoxes, focusLayout, layoutMarkers, App, Map, ScheduleCard, EtaBanner, Sheet, CommuteCard, RouteSetup, CommuteProfiles, PreferencesPanel, GlobalAlertSettings, SummaryCard, Sparkline, Marey, BoardCard, WaitingCard, waitingArrival, TodayCommute, LeaveByCard, DailyTravelControl };

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
